  Excellent dual module implementation providing:

  **Promotion Module (22 methods):**
  - Complete campaign lifecycle management (create → manage → track → stop)
  - Campaign control (start, pause, stop with state validation)
  - Bidding system (minimum bids, bid updates, strategy management)
  - Product and category selection for targeted advertising
  - Comprehensive statistics (word performance, full analytics, media campaigns)
  - Promotion calendar for marketplace events

  **Campaign Lifecycle:**
  - Draft → Active → Paused → Stopped state machine
  - State transition validation prevents invalid operations
  - Campaign rename, update, and deletion support
  - Search/catalog campaign creation (v2 endpoints)

  **Tariffs Module (4 methods):**
  - Commission rate lookup for profit calculations
  - Box storage costs for inventory planning
  - Pallet storage costs for bulk inventory
  - Return handling fees for reverse logistics

  **Business Value:**
  - Complete advertising campaign management
  - ROI tracking and performance analytics
  - Cost structure visibility for pricing decisions
  - Marketplace fee transparency

  **Integration Benefits:**
  - Combine promotion spend with tariff costs for comprehensive ROI
  - Use tariffs for pricing strategy optimization
  - Track campaign performance against commission costs
  - Make data-driven advertising decisions

