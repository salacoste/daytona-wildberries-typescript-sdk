components:
  securitySchemes:
    HeaderApiKey:
      type: apiKey
      name: Authorization
      in: header
  schemas:
    models.TransitTariff:
      type: object
      properties:
        transitWarehouseName:
          type: string
          description: Транзитный склад
        destinationWarehouseName:
          type: string
          description: Склад назначения
        activeFrom:
          type: string
          description: С какого числа доступно транзитное направление
          format: date-time
        boxTariff:
          nullable: true
          type: array
          description: Тариф за транзит коробов. Если `null`, транзит для коробов недоступен
          items:
            $ref: '#/components/schemas/models.VolumeTariff'
        palletTariff:
          type: integer
          description: Тариф за паллету, ₽
    models.VolumeTariff:
      type: object
      properties:
        from:
          type: integer
          description: Объём поставки от, литры
        to:
          type: integer
          description: Объём поставки до, литры
        value:
          type: number
          description: Тариф, ₽ за литр
    models.Box:
      type: object
      properties:
        packageCode:
          type: string
          description: Штрих-код упаковки
        quantity:
          type: integer
          description: Суммарное количество товара в упаковке, шт
        barcodes:
          type: array
          description: Список упакованных товаров
          items:
            $ref: '#/components/schemas/models.GoodInBox'
      example:
        packageCode: WB_689
        quantity: 1
        barcodes:
          - barcode: '1234567891234'
            quantity: 1
    models.GoodInBox:
      type: object
      properties:
        barcode:
          type: string
          description: Баркод
        quantity:
          type: integer
          description: Количество, шт
    models.SuppliesFiltersRequest:
      properties:
        dates:
          description: Фильтр по датам
          items:
            $ref: '#/components/schemas/models.DateFilterRequest'
          type: array
        statusIDs:
          description: |
            Фильтр поставок по статусам. Возможные значения:
              - `1` — Не запланировано
              - `2` — Запланировано
              - `3` — Отгрузка разрешена
              - `4` — Идёт приёмка
              - `5` — Принято
              - `6` — Отгружено на воротах
          items:
            $ref: '#/components/schemas/models.HandySupplyStatus'
          type: array
      type: object
    models.GoodInSupply:
      type: object
      properties:
        barcode:
          description: Баркод товара
          type: string
        vendorCode:
          type: string
          description: Артикул продавца
        nmID:
          type: integer
          description: Артикул WB
        needKiz:
          description: |
            Нужен ли [код маркировки](https://честныйзнак.рф/) для этого товара:
              - `false` — не нужен
              - `true` — нужен
          type: boolean
        tnved:
          type: string
          description: |
            Код ТНВЭД.
            <br>
            Если `"needKiz":true`, а `"tnved":null`, нужно заполнить характеристику товара **ТН ВЭД** в [личном кабинете](https://seller.wildberries.ru/new-goods) или по [API](./work-with-products#tag/Kartochki-tovarov/paths/~1content~1v2~1cards~1update/post)
          nullable: true
        techSize:
          type: string
          description: Размер товара, указанный продавцом
        color:
          description: Цвет товара
          type: string
          nullable: true
        supplierBoxAmount:
          type: integer
          nullable: true
          description: Указано в упаковке, шт
        quantity:
          type: integer
          description: Указано в поставке/заказе, шт
        readyForSaleQuantity:
          type: integer
          nullable: true
          description: Поступило в продажу, шт
        acceptedQuantity:
          type: integer
          nullable: true
          description: Принято, шт
        unloadingQuantity:
          type: integer
          nullable: true
          description: Количество товара на раскладке, шт
      example:
        barcode: '1234567891234'
        vendorCode: wb4sewt0vg
        nmID: 987456654
        needKiz: true
        tnved: '6204430000'
        techSize: C
        color: красный
        supplierBoxAmount: 10
        quantity: 10
        readyForSaleQuantity: 0
        unloadingQuantity: 0
        acceptedQuantity: 0
    models.DateFilterRequest:
      properties:
        from:
          type: string
          description: Дата начала периода
          format: ISO 8601
        till:
          type: string
          description: Дата окончания периода
          format: ISO 8601
        type:
          type: string
          enum:
            - factDate
            - createDate
            - supplyDate
            - updatedDate
          description: |
            Тип дат:
              - `factDate` — дата фактической отгрузки поставки
              - `createDate` — дата создания поставки
              - `supplyDate` — плановая дата отгрузки поставки
              - `updatedDate` — дата изменения поставки
      required:
        - type
      type: object
    models.SupplyDetails:
      type: object
      properties:
        phone:
          description: Телефон пользователя, создавшего поставку
          type: string
        statusID:
          description: |
            ID статуса поставки:
              - `1` — Не запланировано
              - `2` — Запланировано
              - `3` — Отгрузка разрешена
              - `4` — Идёт приёмка
              - `5` — Принято
              - `6` — Отгружено на воротах
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
          type: integer
        virtualTypeID:
          description: |
            ID типа виртуальной поставки. Отображается только для поставок с `"boxTypeID":0`.
              - `0` — Перенос остатков
              - `1` — Обезличка
              - `4` — QR-поставка
              - `5` — Допринято
              - `6` — Скан-приёмка
          type: integer
        boxTypeID:
          description: |
            ID типа поставки:
              - `0` — Без коробов (виртуальная поставка)
              - `1` и `2` — Короба
              - `5` — Монопаллеты
              - `6` — Суперсейф
          type: integer
        createDate:
          description: Дата и время создания поставки
          type: string
        supplyDate:
          description: Плановая дата отгрузки поставки
          type: string
          nullable: true
        factDate:
          description: Дата фактической отгрузки поставки
          type: string
          nullable: true
        updatedDate:
          description: Дата изменения поставки
          type: string
          nullable: true
        warehouseID:
          description: ID склада, на который планируется поставка
          type: integer
        warehouseName:
          description: Название склада, на который планируется поставка
          type: string
        actualWarehouseID:
          description: ID склада, на который поставка была привезена
          type: integer
          nullable: true
        actualWarehouseName:
          description: Название склада, на который поставка привезена
          type: string
        transitWarehouseID:
          description: ID транзитного склада
          type: integer
          nullable: true
        transitWarehouseName:
          description: Название транзитного склада
          type: string
        acceptanceCost:
          description: Предварительная стоимость приёмки, ₽
          type: number
          nullable: true
        paidAcceptanceCoefficient:
          description: Коэффициент приёмки
          type: number
          nullable: true
        rejectReason:
          description: Причина, по которой поставка не может быть принята
          type: string
          nullable: true
        supplierAssignName:
          description: Краткое название продавца
          type: string
        storageCoef:
          description: Коэффициент хранения
          type: string
          nullable: true
        deliveryCoef:
          description: Коэффициент логистики
          type: string
          nullable: true
        quantity:
          type: integer
          description: Добавлено в поставку/заказ, шт
        readyForSaleQuantity:
          type: integer
          nullable: false
          description: Поступило в продажу, шт
        acceptedQuantity:
          type: integer
          nullable: false
          description: Принято, шт
        unloadingQuantity:
          type: integer
          nullable: false
          description: Количество товара, находящегося на раскладке, шт
        depersonalizedQuantity:
          type: integer
          nullable: true
          description: Количество обезличенного товара, шт
      example:
        phone: +7 903 *** 98 62
        statusID: 5
        boxTypeID: 5
        createDate: '2025-07-15T17:17:45+03:00'
        supplyDate: '2025-07-15T00:00:00+03:00'
        factDate: '2025-07-18T11:37:32+03:00'
        updatedDate: '2025-07-18T12:59:53+03:00'
        warehouseID: 507
        warehouseName: Коледино
        actualWarehouseID: 507
        actualWarehouseName: Коледино
        transitWarehouseID: null
        transitWarehouseName: ''
        acceptanceCost: 5000
        paidAcceptanceCoefficient: 10
        rejectReason: null
        supplierAssignName: Магазин
        storageCoef: '215'
        deliveryCoef: '200'
        quantity: 10
        readyForSaleQuantity: 0
        acceptedQuantity: 10
        unloadingQuantity: 10
        depersonalizedQuantity: 0
    models.HandySupplyStatus:
      enum:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
      type: integer
      x-enum-varnames:
        - NotPlanned
        - Planned
        - AllowUnload
        - Accepting
        - Accepted
        - Virtual
        - UnloadedOnGate
    models.Supply:
      properties:
        phone:
          description: Телефон пользователя, создавшего поставку
          type: string
        supplyID:
          description: ID поставки. Если `null`, это заказ, тогда используйте значение поля `preorderID`
          type: integer
          nullable: true
        preorderID:
          description: ID заказа (незапланированная поставка). Для всех виртуальных поставок будет `0`
          type: integer
        createDate:
          description: Дата и время создания поставки
          type: string
        supplyDate:
          description: Плановая дата отгрузки поставки
          type: string
          nullable: true
        factDate:
          description: Дата фактической отгрузки поставки
          type: string
          nullable: true
        updatedDate:
          description: Дата изменения поставки
          type: string
          nullable: true
        statusID:
          description: |
            ID статуса поставки:
              - `1` — Не запланировано
              - `2` — Запланировано
              - `3` — Отгрузка разрешена
              - `4` — Идёт приёмка
              - `5` — Принято
              - `6` — Отгружено на воротах
          enum:
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
          type: integer
      type: object
    models.AcceptanceCoefficient:
      type: object
      properties:
        date:
          type: string
          description: Дата начала действия коэффициента
        coefficient:
          type: number
          description: |
            Коэффициент приёмки:
              - `-1` — приёмка недоступна, вне зависимости от значения поля `allowUnload`
              - `0` — бесплатная приёмка
              - от `1` — множитель стоимости приёмки
        warehouseID:
          type: integer
          description: ID склада. По нему можно получить [информацию о складе](./orders-fbw#tag/Informaciya-dlya-formirovaniya-postavok/paths/~1api~1v1~1warehouses/get)
        warehouseName:
          type: string
          description: Название склада
        allowUnload:
          type: boolean
          description: |
            Доступность приёмки для поставок данного типа, смотри значение поля `boxTypeID`:

             - `true` — приёмка доступна
             - `false` — приёмка не доступна
        boxTypeID:
          type: integer
          description: |
            ID типа поставки:
              - `2` — Короба
              - `5` — Монопаллеты
              - `6` — Суперсейф
            <br>Для типа поставки **QR-поставка с коробами** поле не возвращается
        storageCoef:
          type: string
          nullable: true
          description: Коэффициент хранения
        deliveryCoef:
          type: string
          nullable: true
          description: Коэффициент логистики
        deliveryBaseLiter:
          type: string
          nullable: true
          description: Стоимость логистики первого литра
        deliveryAdditionalLiter:
          type: string
          nullable: true
          description: Стоимость логистики каждого следующего литра
        storageBaseLiter:
          type: string
          nullable: true
          description: |
            Стоимость хранения:
              - для паллет — стоимость за одну паллету
              - для коробов — стоимость хранения за первый литр
        storageAdditionalLiter:
          type: string
          nullable: true
          description: |
            Стоимость хранения каждого последующего литра:
              - для паллет — всегда будет `null`, т.к. стоимость хранения за единицу паллеты определяется в `StorageBaseLiter`
              - для коробов — стоимость хранения за каждый последующий литр
        isSortingCenter:
          type: boolean
          description: |
            Тип склада:

             - `true` — сортировочный центр (СЦ)
             - `false` — обычный
    models.WarehousesResultItems:
      type: object
      properties:
        ID:
          type: integer
          description: ID склада
        name:
          type: string
          description: Название склада
        address:
          type: string
          description: Адрес склада
        workTime:
          type: string
          description: Режим работы склада
        isActive:
          type: boolean
          description: |
            Доступен ли в качестве склада назначения:
            - `true` — да
            - `false` — нет
        isTransitActive:
          type: boolean
          description: |
            Доступен ли в качестве транзитного склада:
            - `true` — да
            - `false` — нет
