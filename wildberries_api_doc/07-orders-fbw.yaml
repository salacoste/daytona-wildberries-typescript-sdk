  /api/marketplace/v3/dbw/orders/status/deliver:
    servers:
      - url: https://marketplace-api.wildberries.ru
    post:
      x-readonly-method: false
      x-category: marketplace
      security:
        - HeaderApiKey: []
      tags:
        - Сборочные задания DBW
      summary: Перевести DBW-заказы в статус доставки
      description: |
        Метод переводит DBW-заказы из статуса `confirm` в статус `deliver` — в доставке. Перед вызовом рекомендуется проверить метаданные маркировки через `/api/marketplace/v3/dbw/orders/meta/details`.

        **Примечание о пути:** В оригинальном анонсе WB от 2026-05-06 этот эндпоинт описан с префиксом `/api/v3/public/dbw/...`. SDK использует канонический префикс `/api/marketplace/v3/dbw/...` (см. Phase 0 research) — путь `/public/` интерпретируется как артефакт черновика документации.

        <div class="description_limit">
        <a href="/openapi/api-information#tag/Vvedenie/Limity-zaprosov">Лимит запросов</a> на один аккаунт продавца:

        | Период | Лимит | Интервал | Всплеск |
        | --- | --- | --- | --- |
        | 1 минута | 300 запросов | 200 мс | 20 запросов |

        Один запрос с кодом ответа <code>409</code> учитывается как 10 запросов

        **Примечание:** Лимиты в этой таблице являются оценочными — WB не публиковал явные значения для DBW-эндпоинтов на момент написания SDK (2026-05-06). Числа унаследованы от существующего эндпоинта `getClientInfo`. Уточнятся при следующем апдейте Swagger от WB.
        </div>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api.OrdersRequestV2DBW'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.DBWStatusSetResponses'
        '400':
          description: Неправильный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.DBWBatchError'
              example:
                detail: {}
                origin: dbw-public-api
                requestId: f1787bd2d1fdс35d6f537316514у4a05
                title: IncorrectRequest
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: Доступ запрещён
        '409':
          description: Метаданные маркировки (SGTIN/IMEI) не прошли проверку. Используйте /api/marketplace/v3/dbw/orders/meta/details для предварительной проверки или исправьте метаданные через /api/marketplace/v3/dbw/orders/meta/sgtin перед повторной попыткой.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
