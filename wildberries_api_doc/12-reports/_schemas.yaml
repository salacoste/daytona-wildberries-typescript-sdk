components:
  schemas:
    IncomesItem:
      type: object
      properties:
        incomeId:
          type: integer
          description: Номер поставки
        number:
          type: string
          maxLength: 40
          description: Номер УПД
        date:
          type: string
          description: Дата поступления. Если часовой пояс не указан, то берётся Московское время UTC+3.
        lastChangeDate:
          type: string
          description: Дата и время обновления информации в сервисе. Это поле соответствует параметру `dateFrom` в запросе. Если часовой пояс не указан, то берётся Московское время UTC+3.
        supplierArticle:
          type: string
          maxLength: 75
          description: Артикул продавца
        techSize:
          type: string
          maxLength: 30
          description: Размер товара
        barcode:
          type: string
          maxLength: 30
          description: Баркод
        quantity:
          type: integer
          description: Количество
        totalPrice:
          type: number
          description: Цена из УПД
        dateClose:
          type: string
          description: Дата принятия (закрытия) в WB. Если часовой пояс не указан, то берётся Московское время UTC+3
        warehouseName:
          type: string
          maxLength: 50
          description: Название склада
        nmId:
          type: integer
          description: Артикул WB
        status:
          type: string
          maxLength: 50
          enum:
            - Принято
          description: Текущий статус поставки
    StocksItem:
      type: object
      properties:
        lastChangeDate:
          type: string
          description: Дата и время обновления информации в сервисе. Это поле соответствует параметру `dateFrom` в запросе. Если часовой пояс не указан, то берётся Московское время (UTC+3)
        warehouseName:
          type: string
          maxLength: 50
          description: Название склада
        supplierArticle:
          type: string
          maxLength: 75
          description: Артикул продавца
        nmId:
          type: integer
          description: Артикул WB
        barcode:
          type: string
          maxLength: 30
          description: Баркод
        quantity:
          type: integer
          description: Количество, доступное для продажи (сколько можно добавить в корзину)
        inWayToClient:
          type: integer
          description: В пути к клиенту
        inWayFromClient:
          type: integer
          description: В пути от клиента
        quantityFull:
          type: integer
          description: Полное (непроданное) количество, которое числится за складом (= `quantity` + в пути)
        category:
          type: string
          maxLength: 50
          description: Категория
        subject:
          type: string
          maxLength: 50
          description: Предмет
        brand:
          type: string
          maxLength: 50
          description: Бренд
        techSize:
          type: string
          maxLength: 30
          description: Размер
        Price:
          type: number
          description: Цена
        Discount:
          type: number
          description: Скидка
        isSupply:
          type: boolean
          description: Договор поставки (внутренние технологические данные)
        isRealization:
          type: boolean
          description: Договор реализации (внутренние технологические данные)
        SCCode:
          type: string
          maxLength: 50
          description: Код контракта (внутренние технологические данные)
    OrdersItem:
      type: object
      properties:
        date:
          type: string
          description: Дата и время заказа. Это поле соответствует параметру `dateFrom` в запросе, если параметр `flag`=1. Если часовой пояс не указан, то берётся Московское время (UTC+3).
        lastChangeDate:
          type: string
          description: Дата и время обновления информации в сервисе. Это поле соответствует параметру `dateFrom` в запросе, если параметр `flag`=0 или не указан. Если часовой пояс не указан, то берётся Московское время (UTC+3).
        warehouseName:
          type: string
          maxLength: 50
          description: Склад отгрузки
        warehouseType:
          type: string
          description: Тип склада хранения товаров
          enum:
            - Склад WB
            - Склад продавца
        countryName:
          type: string
          maxLength: 200
          description: Страна
        oblastOkrugName:
          type: string
          maxLength: 200
          description: Округ
        regionName:
          type: string
          maxLength: 200
          description: Регион
        supplierArticle:
          type: string
          maxLength: 75
          description: Артикул продавца
        nmId:
          type: integer
          description: Артикул WB
        barcode:
          type: string
          maxLength: 30
          description: Баркод
        category:
          type: string
          maxLength: 50
          description: Категория
        subject:
          type: string
          maxLength: 50
          description: Предмет
        brand:
          type: string
          maxLength: 50
          description: Бренд
        techSize:
          type: string
          maxLength: 30
          description: Размер товара
        incomeID:
          type: integer
          description: Номер поставки
        isSupply:
          type: boolean
          description: Договор поставки
        isRealization:
          type: boolean
          description: Договор реализации
        totalPrice:
          type: number
          description: Цена без скидок
        discountPercent:
          type: integer
          description: "Скидка продавца,\_%"
        spp:
          type: number
          description: "Скидка WB,\_%"
        finishedPrice:
          type: number
          description: Цена с учетом всех скидок, кроме суммы по WB Кошельку
        priceWithDisc:
          type: number
          description: Цена со скидкой продавца, в том числе со скидкой WB Клуба
        isCancel:
          type: boolean
          description: |
            Отмена заказа:
              - `true` — заказ отменен
        cancelDate:
          type: string
          description: Дата и время отмены заказа. Если заказ не был отменен, то "0001-01-01T00:00:00".Если часовой пояс не указан, то берётся Московское время UTC+3.
        sticker:
          type: string
          description: ID стикера
        gNumber:
          type: string
          maxLength: 50
          description: ID корзины покупателя. Заказы одной транзакции будут иметь одинаковый `gNumber`
        srid:
          type: string
          description: |
            Уникальный ID заказа.<br>
            Примечание для использующих API Маркетплейс: `srid` равен `rid` в ответах методов сборочных заданий.
    SalesItem:
      type: object
      properties:
        date:
          type: string
          description: Дата и время продажи. Это поле соответствует параметру `dateFrom` в запросе, если параметр `flag`=1. Если часовой пояс не указан, то берётся Московское время (UTC+3).
        lastChangeDate:
          type: string
          description: Дата и время обновления информации в сервисе. Это поле соответствует параметру `dateFrom` в запросе, если параметр `flag`=0 или не указан. Если часовой пояс не указан, то берётся Московское время (UTC+3).
        warehouseName:
          type: string
          maxLength: 50
          description: Склад отгрузки
        warehouseType:
          type: string
          description: Тип склада хранения товаров
          enum:
            - Склад WB
            - Склад продавца
        countryName:
          type: string
          maxLength: 200
          description: Страна
        oblastOkrugName:
          type: string
          maxLength: 200
          description: Округ
        regionName:
          type: string
          maxLength: 200
          description: Регион
        supplierArticle:
          type: string
          maxLength: 75
          description: Артикул продавца
        nmId:
          type: integer
          description: Артикул WB
        barcode:
          type: string
          maxLength: 30
          description: Баркод
        category:
          type: string
          maxLength: 50
          description: Категория
        subject:
          type: string
          maxLength: 50
          description: Предмет
        brand:
          type: string
          maxLength: 50
          description: Бренд
        techSize:
          type: string
          maxLength: 30
          description: Размер товара
        incomeID:
          type: integer
          description: Номер поставки
        isSupply:
          type: boolean
          description: Договор поставки
        isRealization:
          type: boolean
          description: Договор реализации
        totalPrice:
          type: number
          description: Цена без скидок
        discountPercent:
          type: integer
          description: "Скидка продавца,\_%"
        spp:
          type: number
          description: "Скидка WB,\_%"
        paymentSaleAmount:
          type: integer
          description: Скидка за оплату WB Кошельком, ₽
        forPay:
          type: number
          description: К перечислению продавцу.<br>Синхронизация данных занимает до 24 часов, в течение этого времени в поле может отображаться значение `0`
        finishedPrice:
          type: number
          description: Фактическая цена с учётом всех скидок (к взиманию с покупателя).<br>Синхронизация данных занимает до 24 часов, в течение этого времени в поле может отображаться значение `0`
        priceWithDisc:
          type: number
          description: Цена со скидкой продавца, в том числе со скидкой WB Клуба, от которой рассчитывается сумма к перечислению продавцу `forPay`.<br>Синхронизация данных занимает до 24 часов, в течение этого времени в поле может отображаться значение `0`
        saleID:
          type: string
          maxLength: 15
          description: |
            Уникальный ID продажи/возврата
            - `S**********` — продажа
            - `R**********` — возврат (на склад WB)
        sticker:
          type: string
          description: ID стикера
        gNumber:
          type: string
          maxLength: 50
          description: ID корзины покупателя. Заказы одной транзакции будут иметь одинаковый `gNumber`
        srid:
          type: string
          description: |
            Уникальный ID заказа.<br>
            Примечание для использующих API Маркетплейс: `srid` равен `rid` в ответах методов сборочных заданий.
    responseErrorStatistics:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
    responseErrorStatistics2:
      type: object
      properties:
        errors:
          type: string
    ExciseReportRequest:
      type: object
      properties:
        countries:
          type: array
          description: |
            Код стран по стандарту ISO 3166-2. Чтобы получить данные по всем странам, оставьте параметр пустым
          items:
            type: string
            enum:
              - AM
              - BY
              - KG
              - KZ
              - RU
              - UZ
      example:
        countries:
          - AM
          - RU
    ExciseReportResponse:
      type: object
      properties:
        response:
          $ref: '#/components/schemas/models.ExciseReportResponse'
    models.ExciseReportResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/models.ExciseReportResponseData'
    models.ExciseReportResponseData:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
            description: Страна покупателя
            example: Россия
          price:
            type: number
            description: Цена товара, с НДС
            example: 100
          currency_name_short:
            type: string
            description: Валюта
            example: руб
          excise_short:
            type: string
            description: Код маркировки
            example: 0102900254680370215_Re/=lSbNiGD
          barcode:
            type: string
            description: Баркод
            example: '2038893425820'
          nm_id:
            type: integer
            description: Артикул WB
            example: 169085355
          operation_type_id:
            type: integer
            description: |
              Тип операции, если есть:

                * `1` — вывод из оборота
                * `2` — возврат в оборот
            example: 1
          fiscal_doc_number:
            type: integer
            description: Номер фискального документа (чека полного расчёта), если есть
            example: 12345678
          fiscal_dt:
            type: string
            description: Дата фискализации (дата в чеке), если есть, `ГГГГ-ММ-ДД`
            example: '2024-01-01'
          fiscal_drive_number:
            type: string
            description: Номер фискального накопителя, если есть
          rid:
            type: integer
            description: |
              `Rid`
            example: 606217433440
          srid:
            type: string
            description: |
              `Srid`
            example: 7513432034713632943.1.0
    MeasurementPenalties:
      required:
        - data
      type: object
      properties:
        data:
          required:
            - reports
            - total
          type: object
          description: Данные ответа
          properties:
            reports:
              type: array
              description: Удержания
              items:
                type: object
                properties:
                  nmId:
                    type: integer
                    description: Артикул WB
                    example: 123456789
                  subjectName:
                    type: string
                    description: Предмет
                    example: Костюмы спортивные
                  dimId:
                    type: integer
                    description: ID замера
                    example: 123456789
                  prcOver:
                    type: number
                    description: Разница в габаритах, %
                    example: 130.71
                  volume:
                    type: number
                    description: Объём, л (фактические габариты по замеру на складе)
                    example: 6.47
                  width:
                    type: integer
                    description: Ширина, см (фактические габариты по замеру на складе)
                    example: 7
                  length:
                    type: integer
                    description: Длина, см (фактические габариты по замеру на складе)
                    example: 28
                  height:
                    type: integer
                    description: Высота, см (фактические габариты по замеру на складе)
                    example: 33
                  volumeSup:
                    type: number
                    description: Объём, л (габариты карточки товара)
                    example: 4.95
                  widthSup:
                    type: integer
                    description: Ширина, см (габариты карточки товара)
                    example: 8
                  lengthSup:
                    type: integer
                    description: Длина, см (габариты карточки товара)
                    example: 33
                  heightSup:
                    type: integer
                    description: Высота, см (габариты карточки товара)
                    example: 33
                  photoUrls:
                    type: array
                    items:
                      type: string
                    description: Фото замеров
                    example:
                      - https://static-basket-09.wbbasket.ru/vol184/obmer-tovarov/measurement_on_table/wbs35154094220_em907759_n1_b2eaa5ed-bf21-4c58-b419-b5b5ec6f29ee.webp
                      - https://static-basket-09.wbbasket.ru/vol184/obmer-tovarov/measurement_on_table/wbs35159094420_em907759_n2_040407b0-7752-4ae7-a4a4-7ec016e86511.webp
                      - https://static-basket-09.wbbasket.ru/vol184/obmer-tovarov/measurement_on_table/wbs35189094220_em904757_n3_9f502e24-3b3e-4efd-9hac-802813046ac3.webp
                  dtBonus:
                    type: string
                    format: date-time
                    description: Дата штрафа
                    example: '2025-06-02T00:00:00Z'
                  isValid:
                    type: boolean
                    description: |
                      Статус обмера:
                        - `false` — отменён
                        - `true` — подтверждён
                    example: true
                  isValidDt:
                    type: string
                    format: date-time
                    description: Дата и время подтверждения или отмены обмера
                    example: '2025-05-29T13:35:57Z'
                  reversalAmount:
                    type: number
                    description: Сумма сторно
                    example: 0
                  penaltyAmount:
                    type: number
                    description: Сумма штрафа
                    example: 449.83
            total:
              type: integer
              description: Количество удержаний в отчёте. Без учёта `limit` и `offset`
              example: 11
    WHM:
      required:
        - data
      type: object
      properties:
        data:
          required:
            - reports
            - total
          type: object
          description: Данные ответа
          properties:
            reports:
              type: array
              description: Замеры
              items:
                type: object
                properties:
                  nmId:
                    type: integer
                    description: Артикул WB
                    example: 123456789
                  subjectName:
                    type: string
                    description: Предмет
                    example: ''
                  dimId:
                    type: integer
                    description: ID замера
                    example: 123456789
                  volume:
                    type: number
                    description: Объём, л
                  width:
                    type: integer
                    description: Ширина, см
                    example: 66
                  length:
                    type: integer
                    description: Длина, см
                    example: 54
                  height:
                    type: integer
                    description: Высота, см
                    example: 11
                  photoUrls:
                    type: array
                    items:
                      type: string
                    description: Фото замеров
                    example:
                      - https://static-basket-03.wb.ru/vol54/handheld-goods-measurements-photo/8906416_a9f839da-c3b7-4ed6-737c-a9e731250fb0.jpg
                      - https://static-basket-03.wb.ru/vol54/handheld-goods-measurements-photo/8906416_2aac23b7-c8f9-42db-74e9-b4a9c916017c.jpg
                      - https://static-basket-03.wb.ru/vol54/handheld-goods-measurements-photo/8906416_ff93b7c4-19d6-e0a2-4dba-7c2f09f06b3.jpg
                  dt:
                    type: string
                    format: date-time
                    description: Дата и время
                    example: '2025-04-01T00:06:00Z'
            total:
              type: integer
              description: Количество замеров в отчёте. Без учёта `limit` и `offset`
              example: 11
    Response400Retentions:
      type: object
      properties:
        title:
          type: string
          description: Заголовок ошибки
          example: bad request
        status:
          type: integer
          description: HTTP статус-код
          example: 400
        detail:
          type: string
          description: Детали ошибки
          example: 'invalid parameter: dateTo'
        requestId:
          type: string
          description: Уникальный ID запроса
          example: 31db50b5-14c0-4f4e-965e-6e1f9607ee78
        origin:
          type: string
          description: ID внутреннего сервиса WB
          example: dimension-penalty
    Response403Retentions:
      type: object
      properties:
        title:
          type: string
          description: Заголовок ошибки
          example: access denied
        status:
          type: integer
          description: HTTP статус-код
          example: 403
        detail:
          type: string
          description: Детали ошибки
          example: 'abac: access denied'
        requestId:
          type: string
          description: Уникальный ID запроса
          example: 31db50b5-14c0-4f4e-965e-6e1f9607ee78
        origin:
          type: string
          description: ID внутреннего сервиса WB
          example: dimension-penalty
    ResponsePaidStorage:
      type: array
      items:
        type: object
        properties:
          date:
            type: string
            description: Дата, за которую был расчёт или перерасчёт
          logWarehouseCoef:
            type: number
            description: Коэффициент логистики и хранения
          officeId:
            type: integer
            description: ID склада
          warehouse:
            type: string
            description: Название склада
          warehouseCoef:
            type: number
            description: Коэффициент склада
          giId:
            type: integer
            description: ID поставки
          chrtId:
            type: integer
            description: ID размера для этого артикула WB
          size:
            type: string
            description: Размер (`techSize` в карточке товара)
          barcode:
            type: string
            description: Баркод
          subject:
            type: string
            description: Предмет
          brand:
            type: string
            description: Бренд
          vendorCode:
            type: string
            description: Артикул продавца
          nmId:
            type: integer
            description: Артикул WB
          volume:
            type: number
            description: Объём товара
          calcType:
            type: string
            description: Способ расчёта
          warehousePrice:
            type: number
            description: Сумма хранения
          barcodesCount:
            type: integer
            description: Количество единиц товара (штук), подлежащих тарифицированию за расчётные сутки
          palletPlaceCode:
            type: integer
            description: Код паллетоместа
          palletCount:
            type: number
            description: Количество паллет
          originalDate:
            type: string
            description: Если был перерасчёт, это дата первоначального расчёта. Если перерасчёта не было, совпадает с `date`
          loyaltyDiscount:
            type: number
            description: "Скидка программы лояльности,\_₽"
          tariffFixDate:
            type: string
            description: Дата фиксации тарифа
          tariffLowerDate:
            type: string
            description: Дата понижения тарифа
      example:
        - date: '2023-10-01'
          logWarehouseCoef: 0
          officeId: 507
          warehouse: Коледино
          warehouseCoef: 1.7
          giId: 123456
          chrtId: 1234567
          size: '0'
          barcode: ''
          subject: Маски одноразовые
          brand: 1000 Каталог
          vendorCode: Артикул_продавца
          nmId: 1234567
          volume: 12
          calcType: 'короба: без габаритов'
          warehousePrice: 7.65
          barcodesCount: 1
          palletPlaceCode: 0
          palletCount: 0
          originalDate: '2023-10-01'
          loyaltyDiscount: 10
          tariffFixDate: '2023-10-01'
          tariffLowerDate: '2023-11-01'
    GetTasksResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/GetTasksResponseData'
    GetTasksResponseData:
      type: object
      properties:
        id:
          type: string
          description: ID задания
        status:
          type: string
          description: |
            Статус задания:
              * `new` — новое
              * `processing` —  обрабатывается
              * `done` — отчёт готов
              * `purged` — отчёт удалён
              * `canceled` — отклонено
    CreateTaskResponse:
      type: object
      properties:
        data:
