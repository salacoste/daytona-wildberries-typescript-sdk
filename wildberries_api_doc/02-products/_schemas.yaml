components:
  schemas:
    BrandsResponse:
      type: object
      required:
        - brands
        - total
      properties:
        brands:
          type: array
          items:
            type: object
            required:
              - id
              - logoUrl
              - name
            properties:
              id:
                description: ID бренда
                example: 9007199254
                type: integer
              logoUrl:
                description: URL логотипа бренда
                type: string
              name:
                description: Название бренда
                type: string
                example: Brand
        next:
          type: integer
          description: Параметр пагинации. Укажите это значение в запросе, чтобы получить следующий пакет данных. Если поле отсутствует, вы получили все данные
          example: 1212
        total:
          type: integer
          description: Общее количество брендов предмета
          example: 344534
    BrandsResponseError:
      type: object
      required:
        - title
        - detail
        - origin
        - requestId
      properties:
        title:
          type: string
          description: Заголовок ошибки
        detail:
          type: string
          description: Детали ошибки
        origin:
          type: string
          description: ID внутреннего сервиса WB
        requestId:
          type: string
          description: Уникальный ID запроса
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
                description: Текст ошибки
              location:
                type: string
                description: Параметр, где произошла ошибка
              value:
                description: Значение параметра, где произошла ошибка
    StoreContactRequestBody:
      type: object
      description: Контакты склада продавца
      properties:
        contacts:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              comment:
                type: string
                nullable: false
                description: Комментарий
                example: Иванов Иван Иванович. Звонить с 10 до 21 часа.
                maxLength: 1000
              phone:
                type: string
                nullable: false
                description: |
                  Номер телефона.<br>Поддерживаются коды стран:
                    - `+7` — Россия, Казахстан
                    - `+374` — Армения
                    - `+375` — Беларусь
                    - `+996` — Кыргызстан
                example: "+79998887766"
    responseCardCreate:
      type: object
      properties:
        data:
          type: object
          nullable: true
          example: null
          description: Данные ответа
        error:
          description: Флаг ошибки
          type: boolean
        errorText:
          description: Описание ошибки
          type: string
        additionalErrors:
          description: Дополнительные ошибки
          oneOf:
            - type: object
              nullable: true
              properties:
                string:
                  type: string
              additionalProperties: false
            - type: string
              nullable: true
            - type: object
              properties:
                error:
                  type: string
              required:
                - error
    requestMoveNmsImtConn:
      type: object
      required:
        - targetIMT
        - nmIDs
      properties:
        targetIMT:
          description: Существующий `imtID`, под которым необходимо [объединить](https://dev.wildberries.ru/news/101#obuedinenie-i-razuedinenie-kartochek-tovarov) карточки товаров
          type: integer
          example: 123
        nmIDs:
          description: |
            `nmID`, которые необходимо объединить
          minimum: 1
          maximum: 30
          type: array
          items:
            type: integer
          example:
            - 837459235
            - 828572090
    requestMoveNmsImtDisconn:
      type: object
      required:
        - nmIDs
      properties:
        nmIDs:
          description: |
            `nmID`, которые необходимо разъединить
          minimum: 1
          maximum: 30
          type: array
          items:
            type: integer
          example:
            - 837459235
            - 828572090
      additionalProperties: false
    responseIncorrectDate:
      type: object
      properties:
        error:
          type: string
      additionalProperties: false
    responseBodyContentError400:
      type: object
      properties:
        data:
          type: object
          nullable: true
          description: Данные ошибки
        error:
          description: Флаг ошибки
          type: boolean
        errorText:
          description: Текст ошибки
          type: string
        additionalErrors:
          nullable: true
          description: Дополнительные ошибки
          type: object
    responseBodyContentError403:
      type: object
      properties:
        data:
          type: object
          nullable: true
          description: Данные ошибки
        error:
          description: Флаг ошибки
          type: boolean
        errorText:
          description: Текст ошибки
          type: string
        additionalErrors:
          nullable: true
          description: Дополнительные ошибки
          type: string
      example:
        data: null
        error: true
        errorText: Access denied
        additionalErrors: Access denied
    responseContentError:
      type: object
      properties:
        data:
          type: object
          nullable: true
          description: Данные ошибки
        error:
          description: Флаг ошибки
          type: boolean
        errorText:
          description: Текст ошибки
          type: string
        additionalErrors:
          description: Дополнительные ошибки
          type: string
          nullable: true
      example:
        data: null
        error: false
        errorText: ""
        additionalErrors: null
    mediaErrors:
      type: object
      properties:
        additionalErrors:
          description: Дополнительные ошибки
          nullable: true
          type: object
        data:
          type: object
          nullable: true
          description: Данные ошибки
        error:
          description: Флаг ошибки
          type: boolean
        errorText:
          description: Текст ошибки
          type: string
      example:
        additionalErrors: null
        data: null
        error: true
        errorText: Error text
    ResponseError:
      type: object
      properties:
        data:
          type: object
          nullable: true
          description: Данные ошибки
        error:
          type: boolean
          description: Флаг ошибки
        errorText:
          type: string
          description: Текст ошибки
    RequestAlreadyExistsError:
      type: object
      properties:
        data:
          type: object
          description: Данные ответа
          properties:
            id:
              description: ID загрузки
              type: integer
            alreadyExists:
              description: "Флаг дублирования загрузки: `true`\_— такая загрузка уже есть\n"
              type: boolean
        error:
          description: Флаг ошибки
          type: boolean
        errorText:
          description: Текст ошибки
          type: string
    StocksWarehouseError:
      type: array
      items:
        type: object
        properties:
          data:
            description: Дополнительная информация об ошибке
            nullable: true
            type: array
            items:
              type: object
              properties:
                sku:
                  type: string
                  description: Баркод
                amount:
                  type: integer
                  description: Остаток
          code:
            description: Код ошибки
            type: string
          message:
            description: Описание ошибки
            type: string
    TaskCreated:
      type: object
      properties:
        data:
          type: object
          description: Данные ответа
          properties:
            id:
              type: integer
              description: ID загрузки
            alreadyExists:
              type: boolean
              description: "Флаг дублирования загрузки: `true`\_— такая загрузка уже есть\n"
              example: false
        error:
          description: Флаг ошибки
          type: boolean
          example: false
        errorText:
          description: Текст ошибки
          type: string
          example: ""
    Goods:
      type: array
      description: "Товары, цены и скидки для них. Максимум 1\_000\_товаров. Цена и скидка не могут быть пустыми одновременно.\n<br><br>\nЕсли новая цена со скидкой будет хотя бы в\_3 раза меньше старой, она попадёт в\_[карантин](https://seller.wildberries.ru/instructions/ru/ru/material/price-quarantine) и товар будет продаваться по\_старой цене. Ошибка об\_этом будет в\_ответах методов состояний загрузок.\n<br><br>\nВы можете изменить цену или скидку с помощью API либо вывести товар из\_карантина в\_[личном кабинете](https://seller.wildberries.ru/discount-and-prices/quarantine)\n"
      items:
        $ref: "#/components/schemas/Good"
    Good:
      type: object
      required:
        - nmID
      properties:
        nmID:
          type: integer
          example: 123
          description: Артикул WB
        price:
          type: integer
          example: 999
          description: Цена. Валюту можно получить с помощью методов [Получить товары с ценами](./work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1list~1goods~1filter/get) и [Получить товары с ценами по артикулам](./work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1list~1goods~1filter/post), поле `currencyIsoCode4217`
        discount:
          type: integer
          example: 30
          description: "Скидка,\_%"
    SizeGoodsBody:
      description: "Размеры и цены для них. Максимум 1\_000 размеров.\n<br><br>\nДля товаров с поразмерной установкой цен [карантин](https://seller.wildberries.ru/instructions/ru/ru/material/price-quarantine) не применяется\n"
      type: array
      items:
        $ref: "#/components/schemas/SizeGoodReq"
    SizeGoodReq:
      type: object
      required:
        - nmID
        - sizeID
        - price
      properties:
        nmID:
          type: integer
          example: 123
          description: Артикул WB
        sizeID:
          type: integer
          example: 98989887
          description: ID размера. Можно получить с помощью методов [Получить товары с ценами](./work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1list~1goods~1filter/get) и [Получить товары с ценами по артикулам](./work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1list~1goods~1filter/post), поле `sizeID`. В методах Контента это поле `chrtID`
        price:
          type: integer
          example: 999
          description: Цена. Валюту можно получить с помощью методов [Получить товары с ценами](./work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1list~1goods~1filter/get) и [Получить товары с ценами по артикулам](./work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1list~1goods~1filter/post), поле `currencyIsoCode4217`
    ClubDisc:
      type: array
      description: "Товары и скидки WB Клуба для них. Максимум 1\_000\_товаров.\n"
      items:
        $ref: "#/components/schemas/ClubDiscReq"
    ClubDiscReq:
      type: object
      required:
        - nmID
        - clubDiscount
      properties:
        nmID:
          type: integer
          example: 123
          description: Артикул WB
        clubDiscount:
          type: integer
          example: 5
          description: "Скидка WB Клуба,\_%"
    GoodsList:
      type: object
      description: Размеры товара
      properties:
        nmID:
          type: integer
          description: Артикул WB
          example: 98486
        vendorCode:
          type: string
          description: Артикул продавца
          example: "07326060"
        sizes:
          type: array
          description: Размер
          items:
            type: object
            required:
              - sizeID
              - price
              - discountedPrice
              - clubDiscountedPrice
              - techSizeName
            properties:
              sizeID:
                type: integer
                description: ID размера. В методах Контента это поле `chrtID`
                format: int64
                example: 3123515574
              price:
                type: integer
                description: Цена
                example: 500
              discountedPrice:
                type: number
                description: Цена со скидкой
                example: 350
              clubDiscountedPrice:
                type: number
                description: Цена со скидкой, включая скидку WB Клуба
                example: 332.5
              techSizeName:
                description: Размер товара
                type: string
                example: "42"
        currencyIsoCode4217:
          type: string
          description: Валюта, по стандарту ISO 4217
          example: RUB
        discount:
          type: integer
          description: "Скидка,\_%"
          example: 30
        clubDiscount:
          type: integer
          example: 5
          description: "Скидка WB Клуба,\_%"
        editableSizePrice:
          description: |
            Можно ли устанавливать цены отдельно для разных размеров (зависит от категории товара):
              - `true` — можно
              - `false` — нельзя
          type: boolean
          example: true
        isBadTurnover:
          description: |
            Признак неликвидного товара:
              - `true` — неликвидный товар с [низким индексом остатка](https://seller.wildberries.ru/instructions/ru/ru/material/stocks-index?categoryId=e324ce0f-9a2a-4b8d-8fd1-72f751b09b3b&goBackOption=prevRoute#%D1%83%D1%80%D0%BE%D0%B2%D0%BD%D0%B8-%D0%B8%D0%BD%D0%B4%D0%B5%D0%BA%D1%81%D0%B0-%D0%BE%D1%81%D1%82%D0%B0%D1%82%D0%BA%D0%B0)
              - Поле отсутствует — ликвидный товар
          type: boolean
          example: true
    SizeGood:
      type: object
      description: "Информация о\_размере"
      properties:
        nmID:
          type: integer
          example: 123
          description: Артикул WB
        sizeID:
          description: "ID размера. Можно получить с помощью метода [Получение списка товаров по\_артикулам](./work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1list~1goods~1filter/get), поле `sizeID`. В методах Контента это поле `chrtID`"
          type: integer
          example: 98989887
        vendorCode:
          type: string
          example: "34552332"
          description: Артикул продавца
        price:
          type: integer
          example: 1000
          description: Цена
        currencyIsoCode4217:
          type: string
          description: Валюта, по стандарту ISO 4217
          example: RUB
        discountedPrice:
          type: number
          example: 700
          description: "Цена со\_скидкой"
        clubDiscountedPrice:
          type: number
          description: Цена со скидкой, включая скидку WB Клуба
          example: 665
        discount:
          description: "Скидка,\_%"
          type: integer
          example: 30
        clubDiscount:
          type: integer
          example: 5
          description: "Скидка WB Клуба,\_%"
        techSizeName:
          description: Размер товара
          type: string
          example: "42"
        editableSizePrice:
          description: |
            Можно ли устанавливать цены отдельно для разных размеров (зависит от категории товара):
              - `true` — можно
              - `false` — нельзя
          type: boolean
          example: true
        isBadTurnover:
          description: |
            Признак неликвидного товара:
              - `true` — неликвидный товар с [низким индексом остатка](https://seller.wildberries.ru/instructions/ru/ru/material/stocks-index?categoryId=e324ce0f-9a2a-4b8d-8fd1-72f751b09b3b&goBackOption=prevRoute#%D1%83%D1%80%D0%BE%D0%B2%D0%BD%D0%B8-%D0%B8%D0%BD%D0%B4%D0%B5%D0%BA%D1%81%D0%B0-%D0%BE%D1%81%D1%82%D0%B0%D1%82%D0%BA%D0%B0)
              - Поле отсутствует — ликвидный товар
          type: boolean
          example: true
    GoodBufferHistory:
      type: object
      properties:
        nmID:
          type: integer
          example: 544833232
          description: Артикул WB
        vendorCode:
          type: string
          example: "34552332"
          description: Артикул продавца
        sizeID:
          type: integer
          example: 54483342
          description: ID размера. В методах Контента это поле `chrtID`
        techSizeName:
          type: string
          example: XXL
          description: Размер
        price:
          type: integer
          example: 1500
          description: Цена
        currencyIsoCode4217:
          type: string
          example: RUB
          description: Валюта, по стандарту ISO 4217
        discount:
          type: integer
          example: 25
          description: "Скидка,\_%"
        clubDiscount:
          type: integer
          example: 5
          description: "Скидка WB Клуба,\_%"
        status:
          $ref: "#/components/schemas/GoodStatusBuffer"
        errorText:
          type: string
          example: null
          description: Текст ошибки
          nullable: true
    GoodHistory:
      type: object
      properties:
        nmID:
          type: integer
          example: 544833232
          description: Артикул WB
        vendorCode:
          type: string
          example: "34552332"
          description: Артикул продавца
        sizeID:
          type: integer
          example: 54483342
          description: ID размера. В методах Контента это поле `chrtID`
        techSizeName:
          type: string
          example: "42"
          description: Размер
        price:
          type: integer
          example: 1500
          description: Цена
        currencyIsoCode4217:
          type: string
          example: RUB
          description: Валюта, по стандарту ISO 4217
        discount:
          type: integer
          example: 25
          description: "Скидка,\_%"
        clubDiscount:
          type: integer
          example: 5
          description: "Скидка WB Клуба,\_%"
          nullable: true
        status:
          $ref: "#/components/schemas/GoodStatus"
        errorText:
          type: string
          example: You can't change the item price. Item was added to the Sale due to high inventory
          description: "Текст ошибки. Например:\n  - `You can't change the item price. Item was added to the Sale due to high inventory` — ошибка возникает, если товар попал под распродажу по [индексу остатка](https://seller.wildberries.ru/instructions/ru/ru/material/A-1159).\n  - `The new price is several times lower than the current price. Item has been moved to Price Quarantine` — ошибка возникает, если новая цена со скидкой хотя бы в\_3 раза меньше старой. Вы можете изменить цену или скидку с помощью API либо вывести товар из\_карантина в\_[личном кабинете](https://seller.wildberries.ru/discount-and-prices/quarantine).\n"
    SupplierTaskMetadata:
      type: object
      nullable: true
      description: Данные ответа
      properties:
        uploadID:
          type: integer
          example: 395643565
          description: ID загрузки
        status:
          $ref: "#/components/schemas/TaskStatus"
        uploadDate:
          $ref: "#/components/schemas/Date"
        activationDate:
          $ref: "#/components/schemas/Date1"
        overAllGoodsNumber:
          description: Всего товаров
          type: integer
        successGoodsNumber:
          description: Товаров без ошибок
          type: integer
    SupplierTaskMetadataBuffer:
      nullable: true
      type: object
      description: Данные ответа
      properties:
        uploadID:
          type: integer
          example: 395643565
          description: ID загрузки
        status:
          $ref: "#/components/schemas/TaskStatusBuffer"
        uploadDate:
          $ref: "#/components/schemas/Date"
        activationDate:
          $ref: "#/components/schemas/Date1"
        overAllGoodsNumber:
          description: Всего товаров
          type: integer
          example: 100
        successGoodsNumber:
          description: Товаров без ошибок (0, потому что загрузка в обработке)
          type: integer
          example: 0
    Date:
      type: string
      example: "2022-08-21T22:00:13+02:00"
      format: date-time
      description: Дата и время, когда загрузка создана
    Date1:
      type: string
      example: "2022-08-21T22:00:13+02:00"
      format: date-time
      description: "Дата и время, когда загрузка отправляется в\_обработку"
    TaskStatus:
      description: "Статус загрузки:\n  * `3`\_— обработана, в товарах нет ошибок, цены и скидки обновились\n  * `4`\_— отменена\n  * `5`\_— обработана, но в\_товарах есть ошибки. Для товаров без ошибок цены и скидки обновились, а ошибки в\_остальных товарах можно получить с\_помощью метода [Детализация обработанной загрузки](./work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1history~1goods~1task/get)\n  * `6`\_— обработана, но\_во всех товарах есть ошибки. Их тоже можно получить с\_помощью метода [Детализация обработанной загрузки](./work-with-products#tag/Ceny-i-skidki/paths/~1api~1v2~1history~1goods~1task/get)\n"
      type: integer
      example: 3
    TaskStatusBuffer:
      description: "Статус загрузки: `1`\_— в обработке\n"
      type: integer
      example: 1
    GoodStatus:
      description: "Статус товара:\n  * `2`\_— товар без ошибок, цена и/или скидка обновилась\n  * `3`\_— есть ошибки, данные не обновились\n"
      type: integer
      example: 1
    GoodStatusBuffer:
      description: "Статус товара: `1`\_— в обработке\n"
      type: integer
      example: 1
    Error:
      type: object
      nullable: false
      properties:
        code:
          type: string
          description: Код ошибки
          nullable: false
        message:
          type: string
          description: Описание ошибки
          nullable: false
        data:
          type: object
          description: Дополнительные данные ошибки
          nullable: true
    QuarantineGoods:
      type: object
      properties:
        nmID:
          type: integer
          example: 206025152
          description: Артикул WB
        sizeID:
          description: Не используется
          type: integer
          example: null
          nullable: true
        techSizeName:
          description: Не используется
          type: string
          example: ""
        currencyIsoCode4217:
          type: string
          description: Валюта по стандарту ISO 4217
          example: RUB
        newPrice:
          type: number
          format: float
          example: 134
          description: Новая цена продавца до скидки
        oldPrice:
          type: number
          format: float
          example: 4000
          description: Текущая цена продавца до скидки
        newDiscount:
          type: integer
          example: 25
          description: Новая скидка продавца, %
        oldDiscount:
          type: integer
          example: 25
          description: Текущая скидка продавца, %
        priceDiff:
          type: number
          format: float
          description: "Разница: `newPrice` * (1 - `newDiscount` / 100) - `oldPrice` * (1 - `oldDiscount` / 100)"
          example: -2899.5
    Office:
      type: object
      description: Данные о складе WB
      properties:
        address:
          type: string
          nullable: false
          description: Адрес
          example: ул. Троицкая, Подольск, Московская обл.
        name:
          type: string
          nullable: false
          description: Название
          example: Коледино
        city:
          type: string
          nullable: false
          description: Город
          example: Москва
        id:
          type: integer
          format: int64
          nullable: false
          description: ID
          example: 15
        longitude:
          type: number
          format: float64
          nullable: false
          description: Долгота
          example: 55.386871
        latitude:
          type: number
          format: float64
          nullable: false
          description: Широта
          example: 37.588898
        cargoType:
          description: |
            Тип товара, который принимает склад:
              - `1` — малогабаритный товар (МГТ)
              - `2` — сверхгабаритный товар (СГТ)
              - `3` — крупногабаритный товар (КГТ+)
          type: integer
          enum:
            - 1
            - 2
            - 3
          example: 1
        deliveryType:
          type: integer
          description: |
            Тип доставки, который принимает склад:
              - `1` — доставка на склад WB (FBS)
              - `2` — доставка силами продавца (DBS)
              - `3` — доставка курьером WB (DBW)
              - `5` — самовывоз (C&C)
              - `6` — экспресс-доставка силами продавца (ЕDBS)
          enum:
            - 1
            - 2
            - 3
            - 5
            - 6
          example: 1
        federalDistrict:
          type: string
          nullable: true
          example: Центральный
          description: Федеральный округ склада WB. Если `null`, склад находится за пределами РФ или федеральный округ не указан
        selected:
          type: boolean
          nullable: false
          description: Признак того, что склад уже выбран продавцом
    Warehouse:
      type: object
      description: Данные о складе продавца
      properties:
        name:
          type: string
          nullable: false
          description: Название склада продавца
          example: ул. Троицкая, Подольск, Московская обл.
        officeId:
          type: integer
          format: int64
          nullable: false
          description: ID склада WB
          example: 15
        id:
          type: integer
          format: int64
          nullable: false
          description: ID склада продавца
          example: 1
        cargoType:
          description: |
            Тип товара:
              - `1` — малогабаритный товар (МГТ)
              - `2` — сверхгабаритный товар (СГТ)
              - `3` — крупногабаритный товар (КГТ+)
          type: integer
          enum:
            - 1
            - 2
            - 3
          example: 1
        deliveryType:
          type: integer
          description: |
            Тип доставки, который принимает склад:
              - `1` — доставка на склад WB (FBS)
              - `2` — доставка силами продавца (DBS)
              - `3` — доставка курьером WB (DBW)
              - `5` — самовывоз (C&C)
              - `6` — экспресс-доставка силами продавца (ЕDBS)
          enum:
            - 1
            - 2
            - 3
            - 5
            - 6
          example: 1
        isDeleting:
          type: boolean
          nullable: false
          description: |
            Склад удаляется:
              - `false` — нет
              - `true` — да

            После удаления склад пропадёт из списка
          example: false
        isProcessing:
          type: boolean
          nullable: false
          description: |
            Данные склада обновляются:
              - `false` — нет
              - `true` — да, обновление и удаление остатков недоступно

            Обновление данных может занимать несколько минут
          example: true
