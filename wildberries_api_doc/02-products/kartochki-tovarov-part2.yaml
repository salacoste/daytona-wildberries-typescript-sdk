openapi: 3.0.1
info:
  title: 02-products - Карточки товаров (Part 2/4)
  description: Extracted from original file for agent processing
  version: 1.0.0-shard
servers:
  - url: https://content-api.wildberries.ru
tags:
  - name: Карточки товаров
    description: Карточки товаров endpoints
paths:
  /content/v2/cards/update:
    post:
      tags:
        - Карточки товаров
      summary: Редактирование карточек товаров
      description: |
        Метод обновляет карточки товаров. Данные для обновления можно получить через [список карточек товаров](/openapi/work-with-products#tag/Kartochki-tovarov/paths/~1content~1v2~1get~1cards~1list/post) и [список карточек товаров в корзине](/openapi/work-with-products#tag/Kartochki-tovarov/paths/~1content~1v2~1get~1cards~1trash/post).

        <div class="description_important">
          Карточка товара перезаписывается при обновлении. Поэтому в запросе нужно передать <strong>все</strong> параметры карточки, в том числе те, которые вы не собираетесь обновлять.
        </div>

        Нельзя редактировать или удалять баркоды, но можно добавить дополнительный баркод к карточке товара. Параметры `photos`, `video` и `tags` редактировать или удалять через данный метод нельзя.<br>
        Габариты товаров можно указать только в `сантиметрах`, вес товара с упаковкой — в `килограммах`.
        <br><br>
        В одном запросе можно отредактировать максимум 3000 карточек товаров (`nmID`). Максимальный размер запроса 10 Мб.<br>
        Если ответ `Успешно` (`200`), но какие-то карточки не обновились, проверьте [список несозданных карточек товаров](/openapi/work-with-products#tag/Kartochki-tovarov/paths/~1content~1v2~1cards~1error~1list/post).

        <div class="description_limit">
        <a href="/openapi/api-information#tag/Vvedenie/Limity-zaprosov">Лимит запросов</a> на один аккаунт продавца:

        | Период | Лимит | Интервал | Всплеск |
        | --- | --- | --- | --- |
        | 1 минута | 10 запросов | 6 секунд | 5 запросов |
        </div>
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - nmID
                  - vendorCode
                  - sizes
                properties:
                  nmID:
                    type: integer
                    description: Артикул WB
                  vendorCode:
                    type: string
                    description: Артикул продавца
                  brand:
                    type: string
                    description: Бренд
                  title:
                    type: string
                    description: Наименование товара
                    maxLength: 60
                  description:
                    type: string
                    description: |
                      Описание товара<br>
                      Максимальное количество символов зависит от категории товара<br>
                      Стандарт — 2000, минимум — 1000, максимум — 5000<br>
                      Подробно о правилах описания в **Правилах заполнения карточки товара** в [Справочном центре](https://seller.wildberries.ru/help-center/article/A-113#описание) на портале продавцов
                  dimensions:
                    description: |
                      Габариты и вес товара `c упаковкой`.<br>
                      Укажите в `сантиметрах` и `килограммах` для любого товара
                    type: object
                    properties:
                      length:
                        type: integer
                        description: Длина, см
                      width:
                        type: integer
                        description: Ширина, см
                      height:
                        type: integer
                        description: Высота, см
                      weightBrutto:
                        type: number
                        description: Вес, кг<br>Количество знаков после запятой <=3
                  characteristics:
                    type: array
                    description: |
                      Характеристики товара.
                      <br>
                      Можно получить методом [Характеристики предмета](./work-with-products#tag/Kategorii-predmety-i-harakteristiki/paths/~1content~1v2~1object~1charcs~1%7BsubjectId%7D/get)
                    items:
                      type: object
                      required:
                        - id
                        - value
                      properties:
                        id:
                          type: integer
                          description: ID характеристики
                        value:
                          description: |
                            Значения характеристики.
                            <br>
                            Тип данных — массив строк или число — зависит от типа характеристики, см. описание поля `charcType` в методе **Характеристики предмета**.
                            <br>
                            Допустимое количество значений отображено в поле `maxCount` того же метода
                  sizes:
                    type: array
                    description: |
                      Массив размеров<br>
                      Для безразмерного товара всё равно нужно передавать данный массив без параметров (wbSize и techSize), но с баркодом
                    items:
                      type: object
                      properties:
                        chrtID:
                          type: integer
                          description: |
                            ID размера для данного артикула WB<br>
                            Обязателен к заполнению для существующих размеров<br>
                            Для добавляемых размеров не указывается
                        techSize:
                          type: string
                          description: Размер товара (например, XL, S, 45)
                        wbSize:
                          type: string
                          description: Российский размер товара
                        skus:
                          type: array
                          items:
                            type: string
                          description: Баркоды
              example:
                - nmID: 11111111
                  vendorCode: wbiz72wmro
                  brand: ''
                  title: Свитер женский оверсайз с горлом
                  description: '12345'
                  dimensions:
                    length: 35
                    width: 40
                    height: 15
                    weightBrutto: 3
                  characteristics:
                    - id: 14177450
                      value:
                        - хлопок 50% акрил 50%
                    - id: 50
                      value:
                        - свободный крой
                  sizes:
                    - chrtID: 12345678
                      techSize: ONE SIZE
                      wbSize: 78-90
                      skus:
                        - '123487653460134'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseCardCreate'
              example:
                data: null
                error: false
                errorText: ''
                additionalErrors: {}
        '400':
          description: Неправильный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseBodyContentError400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseBodyContentError403'
        '413':
          description: Превышен лимит объёма данных в запросе
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                    description: Заголовок ошибки
                  detail:
                    type: string
                    description: Детали ошибки
                  code:
                    type: string
                    description: Внутренний код ошибки
                  requestId:
                    type: string
                    description: Уникальный ID запроса
                  origin:
                    type: string
                    description: ID внутреннего сервиса WB
                  status:
                    type: number
                    description: HTTP статус-код
                  statusText:
                    type: string
                    description: Расшифровка HTTP статус-кода
              example:
                title: request body too long
                detail: https://openapi.wildberries.ru/content/api/ru/
                code: 71d3de1b-001e-488f-bbf5-55c31254fbeb
                requestId: MN8usr6RfrzWHZfucSvNgb
                origin: s2s-api-auth-content
                status: 413
                statusText: Request Entity Too Large
        '429':
          $ref: '#/components/responses/429'
  /content/v2/cards/moveNm:
    post:
      tags:
        - Карточки товаров
      summary: Объединение и разъединение карточек товаров
      description: |
        Метод объединяет и разъединяет карточки товаров. Карточки товаров считаются объединёнными, если у них одинаковый `imtID`.
        <br><br>
        Для объединения карточек товаров сделайте запрос **с указанием** `imtID`. Можно объединять не более 30 карточек товаров.<br>
        Для разъединения карточек товаров сделайте запрос **без указания** `imtID`. Для разъединенных карточек будут сгенерированы новые `imtID`.
        <br><br>
        Если вы разъедините одновременно несколько карточек товаров, эти карточки объединятся в одну и получат новый `imtID`.<br>
        Чтобы присвоить каждой карточке товара уникальный `imtID`, необходимо передавать по одной карточке товара за запрос.<br>
        <br>
        Максимальный размер запроса 10 Мб.

        <div class="description_important">
          Объединить можно только карточки товаров с одинаковыми предметами.
        </div>

        <div class="description_limit">
        <a href="/openapi/api-information#tag/Vvedenie/Limity-zaprosov">Лимит запросов</a> на один аккаунт продавца для всех методов категории <strong>Контент</strong>:

        | Период | Лимит | Интервал | Всплеск |
        | --- | --- | --- | --- |
        | 1 минута | 100 запросов | 600 миллисекунд | 5 запросов |

        Исключение — методы:

        <ul>
            <li><a href="/openapi/work-with-products#tag/Sozdanie-kartochek-tovarov/paths/~1content~1v2~1cards~1upload/post">создания карточек товаров</a></li>
            <li><a href="/openapi/work-with-products#tag/Sozdanie-kartochek-tovarov/paths/~1content~1v2~1cards~1upload~1add/post">создания карточек товаров с присоединением</a></li>
            <li><a href="/openapi/work-with-products#tag/Kartochki-tovarov/paths/~1content~1v2~1cards~1update/post">редактирования карточек товаров</a></li>
            <li><a href="/openapi/work-with-products#tag/Kartochki-tovarov/paths/~1content~1v2~1cards~1error~1list/post">получения несозданных карточек товаров с ошибками</a></li>
        </ul>
        </div>
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/requestMoveNmsImtConn'
                - $ref: '#/components/schemas/requestMoveNmsImtDisconn'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseCardCreate'
              example:
                data: null
                error: false
                errorText: ''
                additionalErrors: {}
        '400':
          description: Неправильный запрос
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/responseCardCreate'
                  - $ref: '#/components/schemas/responseIncorrectDate'
              examples:
                responseExceededLimit:
                  $ref: '#/components/examples/responseExceededLimit'
                responseCombining:
                  $ref: '#/components/examples/responseCombining'
                responseIncorrectRequestFormat:
                  $ref: '#/components/examples/responseIncorrectRequestFormat'
                responseNonExistentNmId:
                  $ref: '#/components/examples/responseNonExistentNmId'
                responseNonExistentImt:
                  $ref: '#/components/examples/responseNonExistentImt'
                responseCardCreate1:
                  $ref: '#/components/examples/responseCardCreate1'
                responseDuplicateRequests:
                  $ref: '#/components/examples/responseDuplicateRequests'
                responseAllCardsInSameGroup:
                  $ref: '#/components/examples/responseAllCardsInSameGroup'
                responseIncorrectBeginDate:
                  $ref: '#/components/examples/responseIncorrectBeginDate'
                responseIncorrectEndDate:
                  $ref: '#/components/examples/responseIncorrectEndDate'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseCardCreate'
        '413':
          description: Превышен лимит объёма данных в запросе
          content:
            application/json:
              schema:
                type: string
              examples:
                BodySizeExceedsTheGivenLimit:
                  $ref: '#/components/examples/BodySizeExceedsTheGivenLimit'
        '429':
          $ref: '#/components/responses/429'
components:
  schemas:
    responseBodyContentError400:
      type: object
      properties:
        data:
          type: object
          nullable: true
          description: Данные ошибки
        error:
          description: Флаг ошибки
          type: boolean
        errorText:
          description: Текст ошибки
          type: string
        additionalErrors:
          nullable: true
          description: Дополнительные ошибки
          type: object
    responseBodyContentError403:
      type: object
      properties:
        data:
          type: object
          nullable: true
          description: Данные ошибки
        error:
          description: Флаг ошибки
          type: boolean
        errorText:
          description: Текст ошибки
          type: string
        additionalErrors:
          nullable: true
          description: Дополнительные ошибки
          type: string
      example:
        data: null
        error: true
        errorText: Доступ запрещен
        additionalErrors: Доступ запрещен
    requestPublicViewerPublicErrorsTableListV2:
      type: object
      properties:
        cursor:
          $ref: '#/components/schemas/swagger.PublicErrorsCursorInput'
        order:
          $ref: '#/components/schemas/swagger.PublicErrorsOrderV2'
    swagger.PublicErrorsCursorInput:
      type: object
      description: Пагинатор
      properties:
        limit:
          type: number
          format: int
          description: Количество пакетов в ответе
          maximum: 100
          default: 100
        updatedAt:
          type: string
          format: date-time
          description: Дата и время формирования последнего пакета в ответе на предыдущий запрос
        batchUUID:
          type: string
          format: UUID
          description: ID последнего пакета в ответе на предыдущий запрос
    swagger.PublicErrorsOrderV2:
      type: object
      description: Порядок выдачи пакетов
      properties:
        ascending:
          type: boolean
          description: |
            - `false` — сортировка по убыванию
            - `true` — сортировка по возрастанию
          default: true
    responsePublicViewerPublicErrorsTableListV2:
      type: object
      required:
        - data
        - error
        - errorText
        - additionalErrors
      properties:
        data:
          $ref: '#/components/schemas/models.ErrorTableListPublicRespV2'
        error:
          description: Флаг ошибки
          type: boolean
        errorText:
          description: Описание ошибки
          type: string
        additionalErrors:
          nullable: true
          description: Дополнительные ошибки
          type: object
    models.ErrorTableListPublicRespV2:
      type: object
      description: Данные ответа
      required:
        - items
        - cursor
      properties:
        items:
          type: array
          description: Пакеты данных
          items:
            $ref: '#/components/schemas/models.ErrorTableListPublicRespV2Item'
        cursor:
          $ref: '#/components/schemas/viewer_contract.PublicErrorsCursorOutput'
    models.ErrorTableListPublicRespV2Item:
      type: object
      required:
        - batchUUID
        - subjects
        - brands
        - vendorCodes
        - errors
      properties:
        batchUUID:
          type: string
          format: UUID
          description: ID пакета
        subjects:
          type: object
          description: Предметы. Разбивка по `vendorCodes`
          additionalProperties:
            $ref: '#/components/schemas/models.ErrorSubject'
        brands:
          type: object
          description: Бренды. Разбивка по `vendorCodes`
          additionalProperties:
            $ref: '#/components/schemas/models.ErrorBrand'
        vendorCodes:
          type: array
          description: Артикулы продавца
          items:
            type: string
        errors:
          type: object
          description: Ошибки. Разбивка по `vendorCodes`
          additionalProperties:
            type: array
            items:
              type: string
    models.ErrorSubject:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: number
          format: uint64
          description: ID предмета
        name:
          type: string
          description: Название предмета
    models.ErrorBrand:
      type: object
      properties:
        id:
          type: number
          format: uint64
          description: ID бренда
        name:
          type: string
          description: Бренд
    viewer_contract.PublicErrorsCursorOutput:
      type: object
      required:
        - next
        - updatedAt
        - batchUUID
      description: Пагинатор
      properties:
        next:
          type: boolean
          description: |
            Есть ли ещё черновики:
              - `false` — нет
              - `true` — да
        updatedAt:
          type: string
          format: date-time
          description: Дата и время формирования последнего пакета в ответе
        batchUUID:
          type: string
          format: UUID
          description: ID последнего пакета в ответе
    responseCardCreate:
      type: object
      properties:
        data:
          type: object
          nullable: true
          example: null
          description: Данные ответа
        error:
          description: Флаг ошибки
          type: boolean
        errorText:
          description: Описание ошибки
          type: string
        additionalErrors:
          description: Дополнительные ошибки
          oneOf:
            - type: object
              nullable: true
              properties:
                string:
                  type: string
              additionalProperties: false
            - type: string
              nullable: true
            - type: object
              properties:
                error:
                  type: string
              required:
                - error
    requestMoveNmsImtConn:
      type: object
      required:
        - targetIMT
        - nmIDs
      properties:
        targetIMT:
          description: Существующий у продавца `imtID`, под которым необходимо объединить карточки товаров
          type: integer
          example: 123
        nmIDs:
          description: '`nmID`, которые необходимо объединить (максимум 30)'
          type: array
          items:
            type: integer
          example:
            - 837459235
            - 828572090
    requestMoveNmsImtDisconn:
      type: object
      required:
        - nmIDs
      properties:
        nmIDs:
          description: '`nmID`, которые необходимо разъединить (max 30)'
          type: array
          items:
            type: integer
          example:
            - 837459235
            - 828572090
      additionalProperties: false
    responseIncorrectDate:
      type: object
      properties:
        error:
          type: string
      additionalProperties: false
