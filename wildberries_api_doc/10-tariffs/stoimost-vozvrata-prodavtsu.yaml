openapi: 3.0.0
info:
  title: 10-tariffs - Стоимость возврата продавцу
  description: Extracted from original file for agent processing
  version: 1.0.0-shard
servers:
  - url: https://common-api.wildberries.ru
tags:
  - name: Стоимость возврата продавцу
    description: Стоимость возврата продавцу endpoints
paths:
  /api/v1/tariffs/return:
    servers:
      - url: https://common-api.wildberries.ru
    get:
      x-readonly-method: true
      x-category: commonapi
      security:
        - HeaderApiKey: []
      summary: "Тарифы на\_возврат"
      tags:
        - Стоимость возврата продавцу
      description: "Метод возвращает [тарифы](https://seller.wildberries.ru/dynamic-product-categories/return-cost):\n  - на\_перевозку товаров со склада WB или из пункта приёма до продавца\n  - на\_обратную перевозку возвратов, которые не забрал продавец\n\n<div class=\"description_limit\">\n<a href=\"/openapi/api-information#tag/Vvedenie/Limity-zaprosov\">Лимит запросов</a> на один аккаунт продавца:\n\n| Период | Лимит | Интервал | Всплеск |\n| --- | --- | --- | --- |\n| 1 мин | 60 запросов | 1 сек | 5 запросов |\n</div>\n"
      parameters:
        - in: query
          name: date
          required: true
          description: Дата в формате ГГГГ-ММ-ДД
          schema:
            type: string
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: ./_schemas.yaml#/ReturnTariffsResponse
        '400':
          description: Неправильный запрос
          content:
            application/problem+json:
              schema:
                $ref: ./_schemas.yaml#/BadRequest
              example:
                detail: 'parameter "date" in query has an error: empty value is not allowed'
                origin: tariffs
                requestId: e8096bddcfe5e3ff75f1afd26755364c
                title: Bad Request
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
components:
  responses:
    '401':
      description: Не авторизован
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title:
                type: string
                description: Заголовок ошибки
              detail:
                type: string
                description: Детали ошибки
              code:
                type: string
                description: Внутренний код ошибки
              requestId:
                type: string
                description: Уникальный ID запроса
              origin:
                type: string
