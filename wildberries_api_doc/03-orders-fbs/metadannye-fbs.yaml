        "403":
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v3.APIError"
              example:
                code: AccessDenied
                message: Доступ запрещён
                data: {}
        "404":
          description: Не найдено
