components:
  schemas:
    v3.SupplyOrderIDsAPI:
      type: object
      properties:
        orderIds:
          type: array
          description: ID сборочных заданий
          items:
            type: integer
          example:
            - 132334
            - 203984
            - 403543
            - 598349
    PassOffice:
      type: object
      description: Данные о складе, для которого требуется пропуск
      properties:
        name:
          type: string
          nullable: false
          description: Название
          example: Коледино
        address:
          type: string
          nullable: false
          description: Адрес
          example: г. Подольск, д. Коледино, ул. Троицкая
        id:
          type: integer
          format: int64
          nullable: false
          description: ID
          example: 1
    Error:
      type: object
      nullable: false
      properties:
        code:
          type: string
          description: Код ошибки
          nullable: false
        message:
          type: string
          description: Описание ошибки
          nullable: false
        data:
          type: object
          description: Дополнительные данные, обогащающие ошибку
          nullable: true
    MetaValidationFailResponse:
      description: |
        Extended 409 error body returned when marking-code validation fails.
        Extends the base Error shape with an optional `metaDetails` array
        describing each failed assembly task's metadata decision.
        Available from 2026-06-03 for B2C FBS orders validated via Чесный Знак.
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            metaDetails:
              type: array
              description: |
                Per-item metadata validation results. Present when at least one
                assembly task failed marking-code validation.
              items:
                type: object
                properties:
                  key:
                    type: string
                    description: 'Metadata type: imei, uin, sgtin, gtin, expiration, customsDeclaration'
                    example: sgtin
                  value:
                    type: string
                    description: Metadata value (empty string if not filled)
                    example: ''
                  decision:
                    type: string
                    description: 'Validation decision: filled, optional, required, invalid'
                    example: invalid
    Next:
      type: integer
      format: int64
      nullable: false
      description: Параметр пагинации. Содержит значение, которое необходимо указать в запросе для получения следующего пакета данных
      example: 13833711
    Order:
      type: object
      properties:
        address:
          type: object
          nullable: true
          description: Точный адрес покупателя для доставки, если применимо. Из-за особенностей адреса некоторые поля могут быть пустыми
          properties:
            fullAddress:
              description: Адрес доставки
              type: string
              example: Челябинская область, г. Челябинск, 51-я улица Арабкира, д. 10А, кв. 42
            longitude:
              type: number
              format: float64
              nullable: false
              description: Долгота
              example: 44.519068
            latitude:
              type: number
              format: float64
              nullable: false
              description: Широта
              example: 40.20192
        scanPrice:
          type: number
          format: uint32
          description: Цена приёмки в копейках. Отображается после фактической приёмки заказа
          example: 1500
        deliveryType:
          type: string
          nullable: false
          description: |
            Тип доставки:
            - `fbs` — доставка на склад Wildberries (FBS)
          enum:
            - fbs
        supplyId:
          type: string
          description: ID поставки. Возвращается, если заказ закреплён за поставкой
          example: WB-GI-92937123
        orderUid:
          type: string
          description: ID транзакции для группировки сборочных заданий. Сборочные задания в одной корзине покупателя будут иметь одинаковый `orderUid`
          example: 165918930_629fbc924b984618a44354475ca58675
        article:
          type: string
          nullable: false
          description: Артикул продавца
          example: one-ring-7548
        colorCode:
          type: string
          nullable: false
          description: Код цвета (только для колеруемых товаров)
          example: RAL 3017
        rid:
          type: string
          nullable: false
          description: |
            Уникальный ID заказа. <br>
            Примечание: `rid` — это `srid` в ответах методов:
              - [Заявки покупателей на возврат](./user-communication#tag/Vozvraty-pokupatelyami/paths/~1api~1v1~1claims/get)
              - [Заказы](./reports#tag/Osnovnye-otchyoty/paths/~1api~1v1~1supplier~1orders/get)
              - [Продажи](./reports#tag/Osnovnye-otchyoty/paths/~1api~1v1~1supplier~1sales/get)
              - [Отчет о возвратах и перемещении товаров](./reports#tag/Otchyot-o-vozvratah-i-peremeshenii-tovarov)
              - [Отчет о продажах по реализации](./financial-reports-and-accounting#tag/Finansovye-otchyoty/paths/~1api~1v5~1supplier~1reportDetailByPeriod/get)
          example: f884001e44e511edb8780242ac120002
        createdAt:
          type: string
          format: date-time
          nullable: false
          description: Дата создания сборочного задания (RFC3339)
          example: "2022-05-04T07:56:29Z"
        offices:
          type: array
          nullable: true
          description: Список офисов, куда следует привезти товар
          items:
            type: string
            example: Калуга
        skus:
          type: array
          nullable: false
          description: Список баркодов
          items:
            type: string
            example: "6665956397512"
        id:
          type: integer
          format: int64
          nullable: false
          description: ID сборочного задания
          example: 13833711
        warehouseId:
          type: integer
          nullable: false
          description: ID склада продавца, на который поступило сборочное задание
          example: 658434
        officeId:
          type: integer
          format: int64
          nullable: false
          description: ID склада WB, к которому привязан склад продавца
          example: 123
        nmId:
          type: integer
          nullable: false
          description: Артикул WB
          example: 12345678
        chrtId:
          type: integer
          nullable: false
          description: ID размера товара в системе WB
          example: 987654321
        price:
          type: integer
          nullable: false
          description: |
            Цена в валюте продажи с учётом всех скидок, кроме скидки по WB Кошельку, умноженная на 100. Код валюты продажи — в поле `currencyCode`. Предоставляется в информационных целях
          example: 1014
        convertedPrice:
          type: integer
          nullable: false
          description: Цена в валюте страны продавца с учетом всех скидок, кроме скидки по WB Кошельку, умноженная на 100. Предоставляется в информационных целях
          example: 28322
        currencyCode:
          type: integer
          nullable: false
          description: Код валюты продажи
          format: ISO 4217
          example: 933
        convertedCurrencyCode:
          type: integer
          nullable: false
          description: Код валюты страны продавца
          format: ISO 4217
          example: 643
        cargoType:
          type: integer
          nullable: false
          description: |
            Тип товара:
              - `1` — малогабаритный товар (МГТ)
              - `2` — сверхгабаритный товар (СГТ)
              - `3` — крупногабаритный товар (КГТ+)
          enum:
            - 1
            - 2
            - 3
        crossBorderType:
          description: |
            Тип сборочного задания:
              - `0` — не кроссбордер
              - `1` — кроссбордер
          enum:
            - 0
            - 1
          format: int32
          type: integer
          example: 1
          nullable: false
        comment:
          description: Комментарий покупателя
          type: string
          nullable: false
          maxLength: 300
          example: Упакуйте в плёнку, пожалуйста
        isZeroOrder:
          type: boolean
          description: |
            Признак заказа товара с нулевым остатком:
              - `false` — заказ сделан на товар с ненулевым остатком
              - `true` — заказ сделан на товар с нулевым остатком. Такой заказ можно отменить без штрафа за отмену
          example: false
        options:
          type: object
          description: Опции заказа
          properties:
            isB2b:
              type: boolean
              description: |
                Признак B2B-продажи:
                  - `false` — не B2B-продажа
                  - `true` — B2B-продажа
    Supply:
      type: object
      properties:
        id:
          type: string
          nullable: false
          description: ID поставки
          example: WB-GI-1234567
        done:
          type: boolean
          nullable: false
          description: |
            Флаг закрытия поставки:
              - `true` — закрыта
              - `false` — открыта
        createdAt:
          type: string
          format: date-time
          nullable: false
          description: Дата создания поставки (RFC3339)
          example: "2022-05-04T07:56:29Z"
        closedAt:
          type: string
          format: date-time
          nullable: true
          description: Дата закрытия поставки (RFC3339)
          example: "2022-05-04T07:56:29Z"
        scanDt:
          type: string
          nullable: true
          format: date-time
          description: Дата скана поставки (RFC3339)
          example: "2022-05-04T07:56:29Z"
        name:
          type: string
          nullable: false
          description: Наименование поставки
          example: Тестовая поставка
        cargoType:
          type: integer
          nullable: false
          description: |
            Тип товара:
              - `1` — малогабаритный товар (МГТ)
              - `2` — сверхгабаритный товар (СГТ)
              - `3` — крупногабаритный товар (КГТ+)
          enum:
            - 0
            - 1
            - 2
            - 3
        crossBorderType:
          description: |
            Тип поставки:
              - `0` — не кроссбордер
              - `1` — кроссбордер
              - `null` — значение отсутствует
          enum:
            - 0
            - 1
          format: int32
          type: integer
          example: 1
          nullable: true
        destinationOfficeId:
          type: integer
          format: int64
          nullable: true
          description: ID склада назначения поставки. Если `null`, склад назначения не указан
          example: 123
        spotAvailable:
          type: boolean
          example: true
          description: |
            Whether SPOT is available for this supply:
              - `true` — yes. Use the method for [getting SPOT data](./orders-fbs#tag/fbsSupplies/operation/postV3FbsSuppliesSpotList)
              - `false` — no
    OrderNew:
      type: object
      properties:
        address:
          type: object
          nullable: true
          description: Точный адрес покупателя для доставки, если применимо. Из-за особенностей адреса некоторые поля могут быть пустыми
          properties:
            fullAddress:
              description: Адрес доставки
              type: string
              example: Челябинская область, г. Челябинск, 51-я улица Арабкира, д. 10А, кв. 42
            longitude:
              type: number
              format: float64
              nullable: false
              description: Долгота
              example: 44.519068
            latitude:
              type: number
              format: float64
              nullable: false
              description: Широта
              example: 40.20192
        ddate:
          type: string
          description: |
            Планируемая дата доставки.<br>
            Поле отображается для сборочных заданий со сверхгабаритными товарами `СГТ`, `cargoType: 2`
          nullable: false
          example: 17.05.2024
        sellerDate:
          type: string
          nullable: true
          description: |
            Рекомендуемая дата доставки СГТ в сортировочный центр или на склад. <br>
            Поле отображается для сборочных заданий со сверхгабаритными товарами `СГТ`, `cargoType: 2`
          example: 02.06.2025
        salePrice:
          description: |
            Цена продавца в валюте продажи с учётом скидки продавца, без учёта скидки WB Клуба, умноженная на 100. Предоставляется в информационных целях
          type: integer
          nullable: true
          example: 504600
        requiredMeta:
          description: |
            Список метаданных, которые необходимо добавить в сборочное задание, чтобы поставку с этим сборочным заданием можно было перевести в доставку
          type: array
          nullable: true
          items:
            type: string
          example:
            - uin
        optionalMeta:
          description: |
            Список метаданных, которые можно добавить в сборочное задание.<br>
            Поставку со сборочным заданием без этих метаданных можно перевести в доставку, но они могут потребоваться, например, при возврате товара покупателем
          items:
            type: string
          type: array
          nullable: true
          example:
            - sgtin
        deliveryType:
          type: string
          nullable: false
          description: |
            Тип доставки:
            - `fbs` — доставка на склад Wildberries (FBS)
          enum:
            - fbs
        comment:
          description: Комментарий покупателя
          type: string
          nullable: false
          maxLength: 300
          example: Упакуйте в плёнку, пожалуйста
        scanPrice:
          description: Цена приёмки в копейках. Отображается после фактической приёмки заказа. Для данного метода всегда будет возвращаться `null`. Предоставляется в информационных целях
          type: number
          format: uint32
          nullable: true
          example: null
        orderUid:
          type: string
          description: ID транзакции для группировки сборочных заданий. Сборочные задания в одной корзине покупателя будут иметь одинаковый `orderUid`
          example: 165918930_629fbc924b984618a44354475ca58675
        article:
          type: string
          nullable: false
          description: Артикул продавца
          example: one-ring-7548
        colorCode:
          description: Код цвета (только для колеруемых товаров)
          type: string
          nullable: false
          example: RAL 3017
        rid:
          type: string
          nullable: false
          description: |
            Уникальный ID заказа. <br>
            Примечание: `rid` — это `srid` в ответах методов:
              - [Заявки покупателей на возврат](./user-communication#tag/Vozvraty-pokupatelyami/paths/~1api~1v1~1claims/get)
              - [Заказы](./reports#tag/Osnovnye-otchyoty/paths/~1api~1v1~1supplier~1orders/get)
              - [Продажи](./reports#tag/Osnovnye-otchyoty/paths/~1api~1v1~1supplier~1sales/get)
              - [Отчет о возвратах и перемещении товаров](./reports#tag/Otchyot-o-vozvratah-i-peremeshenii-tovarov)
              - [Отчет о продажах по реализации](./financial-reports-and-accounting#tag/Finansovye-otchyoty/paths/~1api~1v5~1supplier~1reportDetailByPeriod/get)
          example: f884001e44e511edb8780242ac120002
        createdAt:
          type: string
          format: date-time
          nullable: false
          description: Дата создания сборочного задания (RFC3339)
          example: "2022-05-04T07:56:29Z"
        offices:
          type: array
          nullable: true
          description: Список офисов, куда следует привезти товар
          items:
            type: string
            example: Калуга
        skus:
          type: array
          nullable: false
          description: Список баркодов
          items:
            type: string
            example: "6665956397512"
        id:
          type: integer
          format: int64
          nullable: false
          description: ID сборочного задания
          example: 13833711
        warehouseId:
          type: integer
          nullable: false
          description: ID склада продавца, на который поступило сборочное задание
          example: 658434
        officeId:
          type: integer
          format: int64
          nullable: false
          description: ID склада WB, к которому привязан склад продавца
          example: 123
        nmId:
          type: integer
          nullable: false
          description: Артикул WB
          example: 123456789
        chrtId:
          type: integer
          nullable: false
          description: ID размера товара в системе WB
          example: 987654321
        price:
          type: integer
          nullable: false
          description: |
            Цена в валюте продажи с учётом всех скидок, кроме скидки по WB Кошельку, умноженная на 100. Код валюты продажи — в поле `currencyCode`. Предоставляется в информационных целях
          example: 1014
        finalPrice:
          description: Сумма к оплате покупателем в валюте продажи с учетом всех скидок, умноженная на 100. Код валюты продажи указан в поле `currencyCode`. Предоставляется в информационных целях
          type: integer
          example: 1014
        convertedPrice:
          type: integer
          nullable: false
          description: Цена в валюте страны продавца с учетом всех скидок, кроме скидки по WB Кошельку, умноженная на 100. Предоставляется в информационных целях
          example: 28322
        convertedFinalPrice:
          description: Сумма к оплате покупателем в валюте страны продавца с учетом всех скидок, умноженная на 100. Предоставляется в информационных целях
          type: integer
          example: 1014
        currencyCode:
          type: integer
          nullable: false
          description: Код валюты продажи
          format: ISO 4217
          example: 933
        convertedCurrencyCode:
          type: integer
          nullable: false
          description: Код валюты страны продавца
          format: ISO 4217
          example: 643
        cargoType:
          type: integer
          nullable: false
          description: |
            Тип товара:
              - `1` — малогабаритный товар (МГТ)
              - `2` — сверхгабаритный товар (СГТ)
              - `3` — крупногабаритный товар (КГТ+)
          enum:
            - 1
            - 2
            - 3
        crossBorderType:
          description: |
            Тип сборочного задания:
              - `0` — не кроссбордер
              - `1` — кроссбордер
          enum:
            - 0
            - 1
          format: int32
          type: integer
          example: 1
          nullable: false
        isZeroOrder:
          type: boolean
          description: |
            Признак заказа товара с нулевым остатком:
              - `false` — заказ сделан на товар с ненулевым остатком
              - `true` — заказ сделан на товар с нулевым остатком. Такой заказ можно отменить без штрафа за отмену
          example: false
        options:
          type: object
          description: Опции заказа
          properties:
            isB2b:
              type: boolean
              description: |
                Признак B2B-продажи:
                  - `false` — не B2B-продажа
                  - `true` — B2B-продажа
    SupplyTrbx:
      type: object
      properties:
        id:
          description: ID короба
          type: string
          example: WB-TRBX-1234567
    TrbxStickers:
      type: object
      properties:
        barcode:
          type: string
          minLength: 1
          description: Закодированное значение стикера
          example: $WBMP:1:123:1234567
        file:
          type: string
          format: byte
          minLength: 1
          description: Полное представление стикера в заданном формате (кодировка base64)
          example: U3dhZ2dlciByb2Nrcw==
    Meta:
      type: object
      description: Метаданные сборочного задания
      properties:
        imei:
          type: object
          properties:
            value:
              nullable: true
              type: string
              example: "123456789012345"
          description: IMEI
        uin:
          type: object
          properties:
            value:
              nullable: true
              type: string
              example: "123456789012345"
          description: УИН
        gtin:
          type: object
          properties:
            value:
              nullable: true
              type: string
              example: "123456789012345"
          description: GTIN
        sgtin:
          type: object
          properties:
            value:
              type: array
              items:
                type: string
              example:
                - "123456789012345"
              nullable: true
          description: Код маркировки Честного знака
        expiration:
          type: object
          properties:
            value:
              type: string
              example: 12.09.2030
              nullable: true
          description: Срок годности товара
          format: date (dd.mm.yyyy)
        customsDeclaration:
          type: object
          properties:
            value:
              type: string
              example: 10704010/010624/0000302
              nullable: true
          description: Номер грузовой таможенной декларации
    v3.GetMetaMultiRequest:
      type: object
      description: ID сборочных заданий
      required:
        - orders
      properties:
        orders:
          items:
            type: integer
          type: array
          maxItems: 100
          example:
            - 123456
            - 234567
            - 345678
    v3.OrdersMetaAPI:
      properties:
        orders:
          items:
            $ref: "#/components/schemas/v3.OrderMetaAPI"
          type: array
      type: object
    v3.OrderMetaAPI:
      properties:
        id:
          type: integer
          description: ID сборочного задания
        meta:
          description: Метаданные сборочного задания
          $ref: "#/components/schemas/Meta"
          type: object
      type: object
    Pass:
      type: object
      description: Данные о пропуске продавца
      properties:
        firstName:
          type: string
          nullable: false
          description: Имя водителя
          example: Александр
        dateEnd:
          type: string
          nullable: false
          description: Дата окончания действия пропуска
          example: "2022-07-31 17:53:13+00:00"
        lastName:
          type: string
          nullable: false
          description: Фамилия водителя
          example: Петров
        carModel:
          type: string
          nullable: false
          description: Марка машины
          example: Lamborghini
        carNumber:
          type: string
          nullable: false
          description: Номер машины
          example: A456BC123
        officeName:
          type: string
          nullable: false
          description: Название склада
          example: Коледино
        officeAddress:
          type: string
          nullable: false
          description: Адрес склада
          example: г. Подольск, д. Коледино, ул. Троицкая
        officeId:
          type: integer
          format: int64
          nullable: false
          description: ID склада
          example: 15
        id:
          type: integer
          format: int64
          nullable: false
          description: ID пропуска
          example: 1
    CrossborderTurkeyClientInfo:
      properties:
        firstName:
          type: string
          description: Имя клиента
          example: Иван
        fullName:
          type: string
          description: Фамилия, Имя, Отчество
          example: Андреев Иван Васильевич
        lastName:
          type: string
          description: Фамилия клиента
          example: Андреев
        middleName:
          type: string
          description: Отчество клиента
          example: Васильевич
        orderID:
          type: integer
          description: Номер заказа
          example: 134567
        phone:
          type: string
          description: Телефон для связи с клиентом
          example: "79871234567"
        phoneCode:
          type: string
          description: Не используется
          example: "0"
    CrossborderTurkeyClientInfoResp:
      properties:
        orders:
          description: Информация по клиенту для кроссбордер-заказа из Турции
          items:
            $ref: "#/components/schemas/CrossborderTurkeyClientInfo"
          type: array
      type: object
    OrdersRequestAPI:
      properties:
        orders:
          description: Список заказов
          items:
            type: integer
          type: array
      type: object
      example:
        orders:
          - 987654321
          - 123456789
    v3.APIError:
      type: object
      properties:
        code:
          type: string
          description: Код ошибки
        message:
          type: string
          description: Описание ошибки
        data:
          type: object
          description: Дополнительные данные ошибки
    CountriesOKSMList:
      type: object
      required:
        - countries
      properties:
        countries:
          description: OKSM countries list
          type: array
          items:
            type: object
            required:
              - code
              - name
            properties:
              code:
                description: Country code
                type: string
                example: "036"
              name:
                description: Country name
                type: string
                example: Австралия
    SupplySpotDataResponse:
      type: object
      required:
        - supplies
      properties:
        supplies:
          type: array
          items:
            type: object
            required:
              - id
            properties:
              id:
                description: Supply ID
                type: string
              spot:
                allOf:
                  - description: SPOT data
                  - $ref: "#/components/schemas/SupplySpotData"
              error:
                allOf:
                  - $ref: "#/components/schemas/ApiErrorV3"
                  - example:
                      value:
                        detail: Incorrect required body
                        title: IncorrectRequestBody
    SupplySpotData:
      type: object
      required:
        - status
        - carrierTaxNumber
        - carrierName
        - carrierCountryCode
        - vehicleRegistrationNumber
      properties:
        status:
          type: string
          enum:
            - pending
            - completed
            - failed
          description: |
            SPOT status:
              - `pending` — waiting for the result of DOPP — Declaration of Upcoming Supply — formation
              - `completed` — DOPP successfully formed. You can [get the QR code](./orders-fbs#tag/fbsSupplies/operation/getV3FbsSuppliesSupplyIdStickersSpot)
              - `failed` — DOPP formation error. See the `errorCode` field for details
        carrierName:
          type: string
          minLength: 1
          maxLength: 1000
          description: Carrier name
        carrierTaxNumber:
          type: string
          description: Carrier tax number
        carrierCountryCode:
          type: string
          description: Carrier [OKSM](./orders-fbs#tag/fbsSupplies/operation/getV3FbsDictionariesCountriesOksm) country code
        vehicleRegistrationNumber:
          type: string
          description: Vehicle registration number
        trailerRegistrationNumber:
          type: string
          description: Trailer registration number
        errorCode:
          type: string
          enum:
            - doppFailed
          description: |
            Error code from the DOPP — Declaration of Upcoming Supply — formation service. Returned when `"status": "failed"`. To fix the error, check the SPOT data and [add it to the supply](./orders-fbs#tag/fbsSupplies/operation/getV3FbsSuppliesSupplyIdSpot) again.
    SupplySpotQRCode:
      type: object
      required:
        - qrCode
      properties:
        qrCode:
          description: Supply QR code in base64 encoding
          example: U3dhZ2dlciByb2Nrcw==
          format: base64
          type: string
    ShippingPoint:
      description: Shipping point data
      type: object
      required:
        - id
        - name
        - address
        - city
        - officeType
        - cargoTypes
        - latitude
        - longitude
        - fulfillment
      properties:
        id:
          format: int64
          type: integer
          example: 100
          description: Shipping point ID
        name:
          type: string
          description: Name
          example: Москва Морской
        address:
          type: string
          description: Address
          example: г Москва, Морской Проспект 54
        city:
          type: string
          example: Москва
          description: Locality
        officeType:
          description: |
            Shipping point type:
              - `sc` — sorting center
              - `sw` — warehouse
              - `pp` — pickup point
          type: string
          example: pp
          enum:
            - sc
            - sw
            - pp
        cargoTypes:
          description: |
            Types of items a shipping point can accept:
              - `1` — small-sized items
              - `2` — over dimensional cargo (ODC)
              - `3` — dimensional cargo+ (CD+)
          type: array
          items:
            type: integer
            enum:
              - 1
              - 2
              - 3
          example:
            - 1
            - 3
        latitude:
          type: number
          description: Latitude
          example: 37.588898
        longitude:
          type: number
          description: Longitude
          example: 55.386871
        fulfillment:
          type: boolean
          description: |
            Service **Fulfillment in SC** for FBS supplies:
              - `true` — available
              - `false` — unavailable
          example: true
    ShippingPointsResponse:
      type: object
      required:
        - shippingPoints
      properties:
        shippingPoints:
          description: Shipping points list
          type: array
          items:
            $ref: "#/components/schemas/ShippingPoint"
    UpdateSuppliesShippingMethodRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/UpdateSupplyShippingMethod"
    UpdateSuppliesResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/UpdatedSupplies"
    UpdateSupplyShippingMethod:
      type: object
      required:
        - shippingDt
        - shippingPointId
        - shippingType
        - supplyId
      properties:
        shippingDt:
          description: Planned supply shipping date, format `YYYY-MM-DD`
          type: string
          example: 2026-08-31
        shippingPointId:
          description: Shipping point ID. You can get it using a [separate method](./orders-fbs#tag/fbsSupplies/operation/getV3FbsShippingPoints)
          type: integer
          example: 100
        shippingType:
          description: |
            Type of shipping to the shipping point:
              - `selfShipping` — shipping at the seller's expense
              - `transportCompany` — delivery via a transport company. For this shipping type, specify the [electronic waybill ID](./orders-fbs#tag/fbsSupplies/operation/patchV3FbsSuppliesWaybill) in the `waybillUuid` field
          type: string
          example: transportCompany
          enum:
            - selfShipping
            - transportCompany
        supplyId:
          example: WB-GI-100
          type: string
          description: Supply ID
    UpdatedSupplies:
      description: Результат обработки запроса для одной поставки
      type: object
      required:
        - supplyId
      properties:
        error:
          $ref: "#/components/schemas/ReplyBatchError"
        success:
          type: boolean
          description: Whether the request was processed successfully for this supply. Can only be `true`
        supplyId:
          type: string
          description: Supply ID
    ReplyBatchError:
      description: Error details
      type: object
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: Error code
        detail:
          type: string
          description: |
            Additional error data
    ApiErrorV3:
      required:
        - title
        - detail
      properties:
        detail:
          description: Error details
          type: string
        title:
          description: Error title
          type: string
      type: object
    Response4XX:
      type: object
      properties:
        title:
          type: string
          description: Error title
        detail:
          type: string
          description: Error details
        code:
          type: string
          description: Internal error code
        requestId:
          type: string
          description: Request ID
        origin:
          type: string
          description: WB internal service ID
        status:
          type: number
          description: HTTP status code
        statusText:
          type: string
          description: Text of the HTTP status code
        timestamp:
          type: string
          format: date-time
          description: Request date and time
  responses:
    "401":
      description: Не авторизован
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
                description: Заголовок ошибки
              detail:
                type: string
                description: Детали ошибки
              code:
                type: string
                description: Внутренний код ошибки
              requestId:
                type: string
                description: Уникальный ID запроса
              origin:
                type: string
                description: ID внутреннего сервиса WB
              status:
                type: number
                description: HTTP статус-код
              statusText:
                type: string
                description: Расшифровка HTTP статус-кода
              timestamp:
                type: string
                format: date-time
                description: Дата и время запроса
          example:
            title: unauthorized
            detail: "token problem; token is malformed: could not base64 decode signature: illegal base64 data at input byte 84"
            code: 07e4668e--a53a3d31f8b0-[UK-oWaVDUqNrKG]; 03bce=277; 84bd353bf-75
            requestId: 7b80742415072fe8b6b7f7761f1d1211
            origin: s2s-api-auth-catalog
            status: 401
            statusText: Unauthorized
            timestamp: "2024-09-30T06:52:38Z"
    "429":
      description: Слишком много запросов
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
                description: Заголовок ошибки
              detail:
                type: string
                description: Детали ошибки
              code:
                type: string
                description: Внутренний код ошибки
              requestId:
                type: string
                description: Уникальный ID запроса
              origin:
                type: string
                description: ID внутреннего сервиса WB
              status:
                type: number
                description: HTTP статус-код
              statusText:
                type: string
                description: Расшифровка HTTP статус-кода
              timestamp:
                type: string
                format: date-time
                description: Дата и время запроса
          example:
            title: too many requests
            detail: limited by c122a060-a7fb-4bb4-abb0-32fd4e18d489
            code: 07e4668e-ac2242c5c8c5-[UK-4dx7JUdskGZ]
            requestId: 9d3c02cc698f8b041c661a7c28bed293
            origin: s2s-api-auth-catalog
            status: 429
            statusText: Too Many Requests
            timestamp: "2024-09-30T06:52:38Z"
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NotFound
            message: Не найдено
    AccessDenied:
      description: Доступ запрещён
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: AccessDenied
            message: Доступ запрещён
  examples:
    ApiError400V3:
      value:
        detail: Not Found
        title: NotFound
    ApiError404V3:
      value:
        detail: Incorrect required body
        title: IncorrectRequestBody
    SpotApiError409V3:
      value:
        detail: SPOT actions aren't available for this shipment
        title: SpotActionNotAllowed
    SupplySpotDataResponse:
      value:
        supplies:
          - id: WB-GI-0000001
            spot:
              carrierTaxNumber: "7588179007"
              carrierName: ООО СПОТ
              carrierCountryCode: "112"
              vehicleRegistrationNumber: А123АА100
              trailerRegistrationNumber: АА000100
              status: completed
          - id: WB-GI-0000002
            spot:
              carrierTaxNumber: "7588179007"
              carrierName: ООО СПОТ
              carrierCountryCode: "112"
              vehicleRegistrationNumber: А123АА100
              trailerRegistrationNumber: АА000100
              status: failed
              errorCode: doppFailed
          - id: WB-GI-0000003
            error:
              title: NotFound
              detail: Not Found
          - id: WB-GI-0000004
            error:
              title: SpotActionNotAllowed
              detail: Spot Action Not Allowed
    UpdatedSuppliesShippingMethod:
      value:
        results:
          - supplyId: WB-GI-100
            success: true
          - supplyId: ax12
            success: false
            error:
              code: 400
              detail: IncorrectRequestBody
          - supplyId: WB-GI-300
            success: false
            error:
              code: 409
              detail: InvalidShippingDt
          - supplyId: WB-GI-99999999
            success: false
            error:
              code: 404
              detail: NotFound
          - supplyId: WB-GI-500
            success: false
            error:
              code: 400
              detail: FulfillmentRequired
          - supplyId: WB-GI-600
            success: false
            error:
              code: 409
              detail: SupplyAlreadyScanned
    AccessDenied:
      value:
        code: AccessDenied
        message: ""
    Response403TokenCategory:
      value:
        status: 403
        statusText: Forbidden
        title: Forbidden
        detail: scope is not allowed for this resource
        requestId: 2dbf6fc9-bad8-4ef9-a058-c938a8553ba5
        origin: ag-marketplace
        timestamp: "2026-09-03T13:55:15Z"
      description: Invalid token category
    WaybillUUIDConflict:
      value:
        code: WaybillUUIDConflict
        message: Waybill UUID is already used
  parameters:
    Supply:
      name: supplyId
      in: path
      required: true
      description: ID поставки
      schema:
        type: string
        example: WB-GI-1234567
    Order:
      name: orderId
      in: path
      required: true
      description: ID сборочного задания
      schema:
        type: integer
        format: int64
        example: 5632423
    Pass:
      name: passId
      in: path
      required: true
      description: ID пропуска
      schema:
        type: integer
        format: int64
        example: 45
    Next:
      name: next
      in: query
      required: true
      schema:
        type: integer
        format: int64
      description: Параметр пагинации. Устанавливает значение, с которого надо получить следующий пакет данных. Для получения полного списка данных должен быть равен `0` в первом запросе. Для следующих запросов необходимо брать значения из одноимённого поля в ответе.
    Limit:
      name: limit
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 1000
      description: Параметр пагинации. Устанавливает предельное количество возвращаемых данных.
  securitySchemes:
    HeaderApiKey:
      type: apiKey
      name: Authorization
      in: header
