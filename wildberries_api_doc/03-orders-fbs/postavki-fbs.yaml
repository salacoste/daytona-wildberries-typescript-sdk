  /api/marketplace/v3/fbs/supplies/{supplyId}/spot:
    servers:
      - url: https://marketplace-api.wildberries.ru
    put:
      x-readonly-method: false
      x-category: marketplace
      security:
        - HeaderApiKey: []
      tags:
        - Поставки FBS
      summary: Add SPOT Data to Supply
      description: |
        The method adds SPOT data to a supply.

        SPOT can only be added to a [supply](./orders-fbs#tag/fbsSupplies/operation/getV3SuppliesSupplyId) with the `"spotAvailable":true` flag.

        <div class="description_limit">
        <a href='./api-information#tag/introduction/Rate-Limits'>Request limit</a> per one seller account for <strong>FBS assembly orders, supplies, passes and auto-return settings</strong> methods:

        | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- |
        | 1 min | 300 requests | 200 ms | 20 requests |

        One request with <code>4XX</code> response codes is counted as 10 requests

        </div>
      parameters:
        - $ref: "#/components/parameters/Supply"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - carrierTaxNumber
                - carrierName
                - carrierCountryCode
                - vehicleRegistrationNumber
              properties:
                carrierName:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  example: ООО СПОТ
                  description: Carrier name
                carrierTaxNumber:
                  type: string
                  minLength: 1
                  maxLength: 50
                  example: "7588179007"
                  description: Carrier tax number
                carrierCountryCode:
                  type: string
                  minLength: 3
                  maxLength: 3
                  example: "112"
                  description: Carrier [OKSM](./orders-fbs#tag/fbsSupplies/operation/getV3FbsDictionariesCountriesOksm) country code
                vehicleRegistrationNumber:
                  type: string
                  minLength: 1
                  maxLength: 30
                  example: А123АА100
                  description: Vehicle registration number
                trailerRegistrationNumber:
                  type: string
                  minLength: 1
                  maxLength: 30
                  example: АА000100
                  description: Trailer registration number
      responses:
        "204":
          description: Добавлено
        "400":
          description: Неправильный запрос
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorV3"
              examples:
                BadRequest:
                  $ref: "#/components/examples/ApiError400V3"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          description: Не найдено
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorV3"
              examples:
                BadRequest:
                  $ref: "#/components/examples/ApiError404V3"
        "409":
          description: Ошибка при добавлении данных SPOT
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiErrorV3"
              examples:
                BadRequest:
                  $ref: "#/components/examples/SpotApiError409V3"
        "429":
          $ref: "#/components/responses/429"
  /api/marketplace/v3/fbs/supplies/spot/list:
    servers:
