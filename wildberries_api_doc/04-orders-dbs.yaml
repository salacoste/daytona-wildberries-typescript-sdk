        4. Закрепить за сборочным заданием код маркировки
        5. Закрепить за сборочным заданием номер ГТД
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID сборочного задания
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - imei
              properties:
                imei:
                  type: string
                  minLength: 15
                  maxLength: 15
                  description: IMEI
      responses:
        '204':
          description: Обновлено
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Ошибка обновления метаданных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v3/dbs/orders/{orderId}/meta/gtin:
    put:
      security:
        - HeaderApiKey: []
      tags:
        - Метаданные DBS
      summary: Закрепить за сборочным заданием GTIN
      description: |
        Метод обновляет GTIN в метаданных сборочного задания — уникальный ID товара в Беларуси.

        У одного сборочного задания может быть только один GTIN.

        Добавлять маркировку можно только для заказов, которые доставляются WB и находятся в статусе `confirm`.

        Максимум 1 000 запросов в минуту суммарно на один аккаунт продавца:

        1. Закрепить за сборочным заданием УИН
        2. Закрепить за сборочным заданием IMEI
        3. Закрепить за сборочным заданием GTIN
        4. Закрепить за сборочным заданием код маркировки
        5. Закрепить за сборочным заданием номер ГТД
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID сборочного задания
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - gtin
              properties:
                gtin:
                  type: string
                  minLength: 13
                  maxLength: 13
                  description: GTIN
      responses:
        '204':
          description: Обновлено
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Ошибка обновления метаданных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v3/dbs/orders/{orderId}/meta/customs-declaration:
    put:
      security:
        - HeaderApiKey: []
      tags:
        - Метаданные DBS
      summary: Закрепить за сборочным заданием номер ГТД
      description: |
        Метод обновляет номер грузовой таможенной декларации в метаданных сборочного задания.

        У одного сборочного задания может быть только один номер ГТД.

        Чтобы проверить, можно ли указать номер ГТД для сборочного задания, используйте метод получения списка новых сборочных заданий:
        - если в поле ответа `requiredMeta` есть значение `customsDeclaration` — можно указать номер ГТД
        - если в поле ответа `requiredMeta` нет значения `customsDeclaration` — указать номер ГТД нельзя

        Максимум 1 000 запросов в минуту суммарно на один аккаунт продавца:

        1. Закрепить за сборочным заданием УИН
        2. Закрепить за сборочным заданием IMEI
        3. Закрепить за сборочным заданием GTIN
        4. Закрепить за сборочным заданием код маркировки
        5. Закрепить за сборочным заданием номер ГТД
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID сборочного задания
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - customsDeclaration
              properties:
                customsDeclaration:
                  type: string
                  maxLength: 50
                  description: Номер грузовой таможенной декларации
                  example: "10129050/010120/0001234"
      responses:
        '204':
          description: Обновлено
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Ошибка обновления метаданных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  schemas:
    DBSOrderNew:
      type: object
      properties:
        address:
          type: object
          properties:
            fullAddress:
              type: string
            longitude:
              type: number
              format: double
            latitude:
              type: number
              format: double
        ddate:
          type: string
          description: Планируемая дата доставки
        salePrice:
          type: number
        dTimeFrom:
          type: string
        dTimeTo:
          type: string
        requiredMeta:
          type: array
          items:
            type: string
          description: Список метаданных, которые необходимо добавить в сборочное задание
        deliveryType:
          type: string
          enum: ['dbs']
        comment:
          type: string
        orderUid:
          type: string
        article:
          type: string
        colorCode:
          type: string
        rid:
          type: string
        createdAt:
          type: string
          format: date-time
        skus:
          type: array
          items:
            type: string
        id:
          type: integer
          format: int64
        warehouseId:
          type: integer
        nmId:
          type: integer
        chrtId:
          type: integer
        price:
          type: integer
        convertedPrice:
          type: integer
        currencyCode:
          type: integer
        convertedCurrencyCode:
          type: integer
        cargoType:
          type: integer
        isZeroOrder:
          type: boolean

    DBSOrder:
      type: object
      properties:
        address:
          type: object
          properties:
            fullAddress:
              type: string
            longitude:
              type: number
              format: double
            latitude:
              type: number
              format: double
        deliveryType:
          type: string
        orderUid:
          type: string
        article:
          type: string
        colorCode:
          type: string
        rid:
          type: string
        createdAt:
          type: string
        skus:
          type: array
          items:
            type: string
        id:
          type: integer
          format: int64
        warehouseId:
          type: integer
        nmId:
          type: integer
        chrtId:
          type: integer
        price:
          type: integer
        convertedPrice:
          type: integer
        currencyCode:
          type: integer
        convertedCurrencyCode:
          type: integer
        cargoType:
          type: integer
        comment:
          type: string
        isZeroOrder:
          type: boolean

    DBSClientInfo:
      type: object
      properties:
        firstName:
          type: string
        fullName:
          type: string
        orderID:
          type: integer
          format: int64
        phone:
          type: string
        phoneCode:
          type: integer
        additionalPhoneCodes:
          type: array
          items:
            type: integer

    DBSOrderStatusBulk:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
          description: ID сборочного задания
        supplierStatus:
          type: string
          enum: ['new', 'confirm', 'deliver', 'receive', 'reject', 'cancel', 'canceled_by_missed_call']
          description: Статус сборочного задания
        wbStatus:
          type: string
          description: Статус системы WB
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: integer
                description: Код ошибки
              detail:
                type: string
                description: Описание ошибки
          description: Ошибки при обработке заказа (если есть)

    StatusSetResponse:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
          description: ID сборочного задания
          example: 4299281547
        isError:
          type: boolean
          description: Признак наличия ошибки
          example: true
        errors:
          type: array
          description: Массив ошибок (если есть)
          items:
            type: object
            properties:
              code:
                type: integer
                description: Код ошибки
                example: 404
              detail:
                type: string
                description: Описание ошибки
                example: "NotFound"

    OrderCodeRequest:
      type: object
      required:
        - orderId
        - code
      properties:
        orderId:
          type: integer
          format: int64
          description: ID сборочного задания
          example: 123456
        code:
          type: string
          description: Код подтверждения. Отображается у покупателя на сайте и в приложении Wildberries
          example: "741852"

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

  responses:
    Unauthorized:
      description: Пользователь не авторизован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Доступ запрещён
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    TooManyRequests:
      description: Слишком много запросов
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    BadRequest:
      description: Неправильный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
