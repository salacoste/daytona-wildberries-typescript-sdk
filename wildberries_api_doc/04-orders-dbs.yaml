  /api/v3/dbs/orders/{orderId}/meta/sgtin:
    put:
      security:
        - HeaderApiKey: []
      tags:
        - Метаданные DBS
      summary: Закрепить за сборочным заданием код маркировки товара
      description: |
        Метод позволяет закрепить за сборочным заданием код маркировки Честный знак.

        Закрепить код маркировки можно только если в метаданных сборочного задания есть поле `sgtin`, а сборочное задание находится в статусе `confirm`.

        Получить загруженные маркировки можно в метаданных сборочного задания.

        Максимум 1 000 запросов в минуту суммарно на один аккаунт продавца:

        1. Закрепить за сборочным заданием УИН
        2. Закрепить за сборочным заданием IMEI
        3. Закрепить за сборочным заданием GTIN
        4. Закрепить за сборочным заданием код маркировки
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: ID сборочного задания
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sgtins:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 24
                  description: Массив кодов маркировки. Допускается от 16 до 135 символов для кода одной маркировки.
      responses:
        '204':
          description: Отправлено
