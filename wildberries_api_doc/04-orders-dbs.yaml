openapi: 3.0.1
info:
  title: Заказы DBS (Delivery by Seller)
  description: |
    Управление сборочными заданиями и метаданными заказов DBS (Delivery by Seller).

    **Важное изменение от 14.01.2026**: Добавлены новые bulk-методы для пакетной обработки заказов.
    С 13 апреля устаревшие методы DBS будут отключены.
  version: 1.0.0
  x-file-name: orders-dbs

servers:
  - url: https://marketplace-api.wildberries.ru
    description: API Server for DBS operations

tags:
  - name: Заказы DBS
    description: Основные методы для работы с заказами DBS
  - name: Сборочные задания DBS
    description: Управление сборочными заданиями DBS
  - name: Метаданные DBS
    description: Работа с метаданными сборочных заданий DBS
  - name: Bulk-операции DBS
    description: Новые методы для пакетной обработки заказов (заменят устаревшие с 13.04.2026)

security:
  - HeaderApiKey: []

paths:
  /api/v3/dbs/orders/new:
    get:
      security:
        - HeaderApiKey: []
      tags:
        - Сборочные задания DBS
      summary: Получить список новых сборочных заданий
      description: |
        Метод предоставляет список всех новых сборочных заданий, которые есть у продавца на момент запроса.

        <div class="description_limit">
        <a href="/openapi/api-information#tag/Vvedenie/Limity-zaprosov">Лимит запросов</a> на один аккаунт продавца для всех методов категории Маркетплейс:

        | Период | Лимит | Интервал | Всплеск |
        | --- | --- | --- | --- |
        | 1 минута | 300 запросов | 200 миллисекунд | 20 запросов |
        </div>
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/DBSOrderNew'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v3/dbs/orders:
    get:
      security:
        - HeaderApiKey: []
      tags:
        - Заказы DBS
      summary: Получить информацию о завершённых сборочных заданиях
      description: |
        Метод предоставляет информацию о завершённых сборочных заданиях после продажи или отмены заказа.
        Можно получить данные за заданный период, максимум 30 календарных дней одним запросом.

        <div class="description_limit">
        <a href="/openapi/api-information#tag/Vvedenie/Limity-zaprosov">Лимит запросов</a> на один аккаунт продавца для всех методов категории Маркетплейс:

        | Период | Лимит | Интервал | Всплеск |
        | --- | --- | --- | --- |
        | 1 минута | 300 запросов | 200 миллисекунд | 20 запросов |
        </div>
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
          required: true
          description: Параметр пагинации. Устанавливает предельное количество возвращаемых данных.
        - name: next
          in: query
          schema:
            type: integer
            format: int64
          required: true
          description: Параметр пагинации. Для получения полного списка данных должен быть равен 0 в первом запросе.
        - name: dateFrom
          in: query
          schema:
            type: integer
            format: int64
          required: true
          description: Дата начала периода в формате Unix timestamp
        - name: dateTo
          in: query
          schema:
            type: integer
            format: int64
          required: true
          description: Дата конца периода в формате Unix timestamp
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  next:
                    type: integer
                    format: int64
                    description: Следующее значение для пагинации
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/DBSOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v3/dbs/orders/client:
    post:
      security:
        - HeaderApiKey: []
      tags:
        - Заказы DBS
      summary: Информация о покупателе
      description: |
        Метод предоставляет информацию о покупателе по ID сборочного задания.

        <div class="description_limit">
        <a href="/openapi/api-information#tag/Vvedenie/Limity-zaprosov">Лимит запросов</a> на один аккаунт продавца для всех методов категории Маркетплейс:

        | Период | Лимит | Интервал | Всплеск |
        | --- | --- | --- | --- |
        | 1 минута | 300 запросов | 200 миллисекунд | 20 запросов |
        </div>
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - orders
              properties:
                orders:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: Список заказов
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/DBSClientInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ============================================================================
  # НОВЫЕ BULK-МЕТОДЫ (с 14.01.2026)
  # ============================================================================

  /api/marketplace/v3/dbs/orders/status/info:
    post:
      security:
        - HeaderApiKey: []
      tags:
        - Bulk-операции DBS
      summary: Получить статусы сборочных заданий (bulk)
      description: |
        **Новый метод** - пакетное получение статусов сборочных заданий.

        Метод возвращает статусы сборочных заданий по их ID.

        <br><br>
        `supplierStatus` — статус сборочного задания. Триггер его изменения — действие самого продавца.

        Возможные значения `supplierStatus`:
        | Статус | Описание |
        | --- | --- |
        | `new` | Новое сборочное задание |
        | `confirm` | На сборке |
        | `deliver` | В доставке |
        | `receive` | Получено покупателем |
        | `reject` | Отказ покупателя при получении |
        | `cancel` | Отменено продавцом |
        | `canceled_by_missed_call` | Отмена по причине недозвона |

        `wbStatus` — статус сборочного задания в системе WB.
        Возможные значения: `waiting`, `sorted`, `sold`, `canceled`, `canceled_by_client`, `declined_by_client`, `defect`, `ready_for_pickup`, `canceled_by_missed_call`.

        <div class="description_limit">
        <a href="/openapi/api-information#tag/Vvedenie/Limity-zaprosov">Лимит запросов</a> на один аккаунт продавца для методов сборочных заданий DBS:

        | Период | Лимит | Интервал | Всплеск |
        | --- | --- | --- | --- |
        | 1 минута | 300 запросов | 200 миллисекунд | 20 запросов |
        </div>
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - ordersIds
              properties:
                ordersIds:
                  type: array
                  items:
                    type: integer
                    format: int64
                  maxItems: 1000
                  description: Список ID сборочных заданий (до 1000 шт)
                  example: [123456, 234567, 345678]
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/DBSOrderStatusBulk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/marketplace/v3/dbs/orders/status/cancel:
    post:
      security:
        - HeaderApiKey: []
      tags:
        - Bulk-операции DBS
      summary: Отменить сборочные задания (bulk)
      description: |
        **Новый метод** - пакетная отмена сборочных заданий.

        Метод переводит сборочные задания из статусов `new`, `confirm` и `deliver` в статус `cancel` — отменено продавцом.

        <div class="description_limit">
        <a href="/openapi/api-information#tag/Vvedenie/Limity-zaprosov">Лимит запросов</a> на один аккаунт продавца для методов сборочных заданий DBS:

        | Период | Лимит | Интервал | Всплеск |
        | --- | --- | --- | --- |
        | 1 минута | 100 запросов | 600 миллисекунд | 20 запросов |
        </div>

        **Важно**: Один запрос с кодом ответа 409 учитывается как 10 запросов.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - ordersIds
              properties:
                ordersIds:
                  type: array
                  items:
                    type: integer
                    format: int64
                  maxItems: 1000
                  description: Список ID сборочных заданий для отмены (до 1000 шт)
                  example: [123456, 234567]
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                required:
                  - requestId
                  - results
                properties:
                  requestId:
                    type: string
                    format: uuid
                    description: Уникальный ID запроса
                    example: "03615778-eb9e-4f55-b4Of-fd3ac0fad2сc"
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/StatusSetResponse'
        '400':
          description: Неправильный запрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: object
                    description: Детали ошибки
                  origin:
                    type: string
                    description: ID внутреннего сервиса WB
                  requestId:
                    type: string
                    description: Уникальный ID запроса
                  title:
                    type: string
                    description: Заголовок ошибки
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Ошибка обновления статуса
          content:
            application/json:
              schema:
                type: object
