          type: boolean
          description: |
            Признак заказа товара с нулевым остатком:
              - `false` — заказ сделан на товар с ненулевым остатком
              - `true` — заказ сделан на товар с нулевым остатком. Такой заказ можно отменить без штрафа за отмену
          example: false
    DbsOnlyClientInfo:
      properties:
        replacementPhone:
          type: string
          description: |
            Подменный номер для связи с покупателем. <br>
            Пустое значение `""` указывает, что номер еще не назначен <br>
          example: "79871234567"
          nullable: false
        firstName:
          type: string
          description: Имя покупателя
          nullable: false
        fullName:
          type: string
          description: Полное имя, используется для оформления документов. Например, документы на автомобиль
          example: Иван Иван Иванович
          nullable: false
        orderID:
          type: integer
          description: ID сборочного задания
          example: 134567
        phone:
          type: string
          description: |
            Резервный подменный номер телефона для связи с покупателем. <br>
            Используйте, если недоступен основной номер из `replacementPhone`.
            Чтобы позвонить покупателю, наберите этот номер и добавочный код из `phoneCode`. <br>
            Пустое значение `""` указывает, что номер ещё не назначен
          example: "+79871234567"
          nullable: false
        phoneCode:
          type: integer
          description: |
            Добавочный код. <br>
            Пустое значение `""` указывает, что код ещё не назначен
          example: 1234567
          nullable: false
        additionalPhoneCodes:
          nullable: false
          type: array
          items:
            type: string
          description: |
            Дополнительные добавочные коды. <br>
            Используйте, если не получилось дозвониться по добавочному коду из `phoneCode`.<br>
            Пустое значение `""` указывает, что код ещё не назначен
          example:
            - "12345"
            - "65498"
      type: object
    DbsOnlyClientInfoResp:
      properties:
        orders:
          description: Информация о покупателе
          items:
            $ref: "#/components/schemas/DbsOnlyClientInfo"
          type: array
      type: object
    DeliveryDatesInfoResp:
      type: object
      properties:
        orders:
          type: array
          items:
            type: object
            properties:
              dTimeFrom:
                type: string
                nullable: true
                description: Актуальное время доставки "с"
                example: "11:11"
              dTimeTo:
                type: string
                nullable: true
                description: Актуальное время доставки "по"
                example: "22:22"
              dTimeFromOld:
                type: string
                nullable: true
                description: Прежнее время доставки "с". Доступно первые сутки после изменения
                example: "12:30"
              dTimeToOld:
                type: string
                nullable: true
                description: Прежнее время доставки "по". Доступно первые сутки после изменения
                example: "22:30"
              dDateOld:
                type: string
                nullable: true
                description: Прежняя дата доставки. Доступна первые сутки после изменения
                example: "2025-01-28"
              dDate:
                type: string
                nullable: false
                description: Актуальная дата доставки
                example: "2025-02-20"
              id:
                type: integer
                description: ID сборочного задания
                example: 1234567890
    Meta:
      type: object
      description: Метаданные сборочного задания
      nullable: true
      properties:
        imei:
          type: object
          properties:
            value:
              nullable: true
              type: string
              example: "123456789012345"
          description: IMEI
        uin:
          type: object
          properties:
            value:
              nullable: true
              type: string
              example: "123456789012345"
          description: УИН
        gtin:
          type: object
          properties:
            value:
              nullable: true
              type: string
              example: "123456789012345"
          description: GTIN
        sgtin:
          type: object
          properties:
            value:
              type: array
              items:
                type: string
              example:
                - "123456789012345"
              nullable: true
          description: Код маркировки Честного знака
        customsDeclaration:
          type: object
          properties:
            value:
              type: string
              example: 10704010/010624/0000302
              nullable: true
          description: Номер грузовой таможенной декларации
    api.OrdersMetaDeleteRequest:
      type: object
      required:
        - key
        - orderIds
      properties:
        key:
          type: string
          example: imei
          description: Название метаданных для удаления (**imei**, **uin**, **gtin**, **sgtin**). Передаётся только одно значение
        orderIds:
          type: array
          description: Список ID сборочных заданий
          maxItems: 1000
          example:
            - 123456
            - 234567
          items:
            type: integer
    api.OrdersGTINSetRequest:
      type: object
      required:
        - orders
      properties:
        orders:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/api.GTIN"
    api.GTIN:
      type: object
      properties:
        gtin:
          description: GTIN
          minLength: 13
          maxLength: 13
          type: string
          example: "1234567890123"
        orderId:
          description: ID сборочного задания
          type: integer
          example: 123456
    api.OrdersIMEISetRequest:
      type: object
      required:
        - orders
      properties:
        orders:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/api.IMEI"
    api.IMEI:
      type: object
      properties:
        orderId:
          description: ID сборочного задания
          type: integer
          example: 123456
        imei:
          type: string
          minLength: 15
          maxLength: 15
          description: IMEI
          example: "654321741987258"
    api.OrdersSGTINsSetRequest:
      type: object
      required:
        - orders
      properties:
        orders:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/api.SGTINs"
    api.SGTINs:
      type: object
      properties:
        orderId:
          description: ID сборочного задания
          type: integer
          example: 123456
        sgtins:
          type: array
          minItems: 1
          maxItems: 24
          description: Массив кодов маркировки. Допускается от 16 до 135 символов для кода одной маркировки
          example:
            - "123456789012345678"
            - "1234567890123456"
          items:
            type: string
    api.OrdersUINSetRequest:
      type: object
      required:
        - orders
      properties:
        orders:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/api.UIN"
    api.UIN:
      type: object
      properties:
        orderId:
          description: ID сборочного задания
          type: integer
          example: 123456
        uin:
          type: string
          minLength: 16
          maxLength: 16
          description: УИН
          example: "1234568909091232"
    api.OrdersRequestV2:
      type: object
      properties:
        ordersIds:
          description: Список ID сборочных заданий
          example:
            - 123456
            - 234567
          maxItems: 1000
          type: array
          items:
            type: integer
    api.StatusSetResponses:
      type: object
      example:
        requestId: 03615778-eb9e-4f55-b4Of-fd3ac0fad2сc
        results:
          - orderId: 4299281547
            isError: true
            errors:
              - code: 404
                detail: NotFound
          - orderId: 4279781545
            isError: false
      properties:
        requestId:
          type: string
          description: Уникальный ID запроса
          example: f1787bd2d1fdс35d6f537316514у4a05
        results:
          type: array
          items:
            $ref: "#/components/schemas/api.StatusSetResponse"
    api.StatusSetResponse:
      type: object
      properties:
        errors:
          items:
            $ref: "#/components/schemas/api.BatchErrorResponse"
          type: array
          description: Детали ошибки
        isError:
          type: boolean
          description: Есть ли ошибки
          example: true
        orderId:
          type: integer
          description: ID сборочного задания с успешно обновлёнными метаданными
          example: 123456
    api.OrdersMetaResponse:
      type: object
      properties:
        meta:
          type: array
          description: Метаданные сборочных заданий
          items:
            $ref: "#/components/schemas/api.OrderMetaV2"
    api.OrderMetaV2:
      type: object
      properties:
        error:
          type: string
          description: |
            Сообщение об ошибке. <br>
            Если `error: not found`, сборочное задание не найдено
          example: ""
        gtin:
          type: string
          description: GTIN
          example: "123456789012345"
        imei:
          type: string
          description: IMEI
          example: "123456789012345"
        orderId:
          type: integer
          description: ID сборочного задания
          example: 654321
        sgtin:
          type: array
          description: Код маркировки Честного знака
          items:
            type: string
            example: "123456789012345"
        uin:
          type: string
          description: УИН
          example: "123456789012345"
        customsDeclaration:
          type: object
          properties:
            value:
              type: string
              example: 10704010/010624/0000302
              nullable: true
          description: Номер грузовой таможенной декларации
    api.OrderStatusesV2:
      type: object
      example:
        orders:
          - supplierStatus: confirm
            wbStatus: waiting
            errors: []
            orderId: 123456
          - supplierStatus: ""
            wbStatus: ""
            errors:
              - code: 404
                detail: NotFound
            orderId: 789012
      properties:
        orders:
          type: array
          description: Информация о статусах
          items:
            $ref: "#/components/schemas/api.OrderStatusV2"
    api.OrderStatusV2:
      type: object
      properties:
        errors:
          description: Информация об ошибке
          items:
            $ref: "#/components/schemas/api.BatchErrorResponse"
          type: array
        orderId:
          type: integer
          description: ID сборочного задания
          example: 123456
        supplierStatus:
          type: string
          description: Статус сборочного задания, установленный продавцом
          example: deliver
        wbStatus:
          type: string
          description: Статус сборочного задания в системе Wildberries
          example: waiting
    api.OrdersCodeRequest:
      type: object
      required:
        - orders
      properties:
        orders:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/api.OrderCodeRequest"
    api.OrderCodeRequest:
      type: object
      properties:
        code:
          type: string
          example: "741852"
          description: Код подтверждения. <br> Отображается у покупателя на сайте и в приложении Wildberries
        orderId:
          type: integer
          description: ID сборочного задания
          example: 123456
    api.BatchError:
      properties:
        detail:
          type: object
          description: Детали ошибки
          example: {}
        origin:
          type: string
          description: ID внутреннего сервиса WB
          example: dbs-public-api
        requestId:
          type: string
          description: Уникальный ID запроса
          example: f1787bd2d1fdс35d6f537316514у4a05
        title:
          type: string
          description: Заголовок ошибки
          example: IncorrectRequest
      type: object
    api.BatchErrorResponse:
      properties:
        code:
          type: integer
          description: Код ошибки
          example: 404
        detail:
          type: string
          description: |
            - `not found` — сборочное задание не найдено
            - `status conflict` — операция невозможна для этого статуса сборочного задания
          example: not found
      type: object
    api.Error:
      properties:
        detail:
          type: object
          description: Детали ошибки
          example: {}
        origin:
          type: string
          description: ID внутреннего сервиса WB
          example: dbs-public-api
        requestId:
          type: string
          description: Уникальный ID запроса
          example: f1787bd2d1fdс35d6f537316514у4a05
        title:
          type: string
          description: Заголовок ошибки
          example: FailedToUpdateMeta
      type: object
    api.B2bClientInfoResponses:
      type: object
      required:
        - requestId
      example:
        requestId: 03615778-eb9e-4f55-b4O4-fd3ac0fad2сc
        results:
          - orderId: 4299281547
            isError: true
            errors:
              - code: 404
                detail: NotFound
          - orderId: 4279781545
            isError: false
            data:
              orgName: ИП Иванов И.И.
              inn: "8888888888"
              kpp: ""
      properties:
        requestId:
          type: string
          description: Уникальный ID запроса
        results:
          type: array
          items:
            $ref: "#/components/schemas/api.B2bClientInfoResponse"
    api.B2bClientInfoResponse:
      type: object
      required:
        - isError
        - orderId
      properties:
        data:
          $ref: "#/components/schemas/api.B2bClientInfo"
        errors:
          type: array
          description: Детали ошибки
          items:
            type: object
            properties:
              code:
                type: integer
                description: Код ошибки
              detail:
                type: string
                description: Описание ошибки
        isError:
          type: boolean
          description: Есть ли ошибки
          example: true
        orderId:
          type: integer
          description: ID сборочного задания
          example: 123456
    api.B2bClientInfo:
      type: object
      description: Данные покупателя B2B
      properties:
        inn:
          type: string
          description: Индивидуальный номер налогоплательщика (ИНН)
        kpp:
          type: string
          description: Код причины постановки на учёт (КПП)
        orgName:
          type: string
          description: Наименование организации
  responses:
    "401":
      description: Не авторизован
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title:
                type: string
                description: Заголовок ошибки
              detail:
                type: string
                description: Детали ошибки
              code:
                type: string
                description: Внутренний код ошибки
              requestId:
                type: string
                description: Уникальный ID запроса
              origin:
                type: string
                description: ID внутреннего сервиса WB
              status:
                type: number
                description: HTTP статус-код
              statusText:
                type: string
                description: Расшифровка HTTP статус-кода
              timestamp:
                type: string
                format: date-time
                description: Дата и время запроса
          example:
            title: unauthorized
            detail: "token problem; token is malformed: could not base64 decode signature: illegal base64 data at input byte 84"
            code: 07e4668e--a53a3d31f8b0-[UK-oWaVDUqNrKG]; 03bce=277; 84bd353bf-75
            requestId: 7b80742415072fe8b6b7f7761f1d1211
            origin: s2s-api-auth-catalog
            status: 401
            statusText: Unauthorized
            timestamp: "2024-09-30T06:52:38Z"
    "429":
      description: Слишком много запросов
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title:
                type: string
                description: Заголовок ошибки
              detail:
                type: string
                description: Детали ошибки
              code:
                type: string
                description: Внутренний код ошибки
              requestId:
                type: string
                description: Уникальный ID запроса
              origin:
                type: string
                description: ID внутреннего сервиса WB
              status:
                type: number
                description: HTTP статус-код
              statusText:
                type: string
                description: Расшифровка HTTP статус-кода
              timestamp:
                type: string
                format: date-time
                description: Дата и время запроса
          example:
            title: too many requests
            detail: limited by c122a060-a7fb-4bb4-abb0-32fd4e18d489
            code: 07e4668e-ac2242c5c8c5-[UK-4dx7JUdskGZ]
            requestId: 9d3c02cc698f8b041c661a7c28bed293
            origin: s2s-api-auth-catalog
            status: 429
            statusText: Too Many Requests
            timestamp: "2024-09-30T06:52:38Z"
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NotFound
            message: ""
    AccessDenied:
      description: Доступ запрещён
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: AccessDenied
            message: ""
  parameters:
    OrderDBS:
      name: orderId
      in: path
      required: true
      description: ID сборочного задания
      schema:
        type: integer
        format: int64
        example: 5632423
    Order:
      name: orderId
      in: path
      required: true
      description: ID сборочного задания
      schema:
        type: integer
        format: int64
        example: 5632423
    Next:
      name: next
      in: query
      required: true
      schema:
        type: integer
        format: int64
      description: Параметр пагинации. Устанавливает значение, с которого надо получить следующий пакет данных. Для получения полного списка данных должен быть равен `0` в первом запросе. Для следующих запросов необходимо брать значения из одноименного поля в ответе.
    Limit:
      name: limit
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 1000
      description: Параметр пагинации. Устанавливает предельное количество возвращаемых данных.
  securitySchemes:
    HeaderApiKey:
      type: apiKey
      name: Authorization
      in: header
