        | --- | --- | --- | --- |
        | 1 min | 300 requests | 200 ms | 20 requests |

        One request with <code>4XX</code> response codes is counted as 10 requests

        </div>
      parameters:
        - name: city
          in: query
          description: Locality for shipping the supply, Cyrillic
          required: true
          example: Москва
          schema:
            type: string
        - name: cargoType
          in: query
          description: |
            The type of items a shipping point can accept:
              - `1` — small-sized items
              - `2` — over dimensional cargo (ODC)
              - `3` — dimensional cargo+ (CD+)
          required: true
          example: 1
          schema:
            type: integer
            enum:
              - 1
              - 2
              - 3
      responses:
