                          example: 231648
                        partB:
                          type: integer
                          nullable: false
                          description: Вторая часть ID стикера
                          example: 9753
                        barcode:
                          type: string
                          nullable: false
                          description: Закодированное значение стикера
                          example: '!uKEtQZVx'
                        file:
                          type: string
                          format: byte
                          nullable: false
                          description: Полное представление стикера в заданном формате (кодировка base64)
                          example: 
        '400':
