  /api/marketplace/v3/fbs/supplies/shipping-method:
    servers:
      - url: https://marketplace-api.wildberries.ru
    patch:
      x-readonly-method: false
      x-category: marketplace
      security:
        - HeaderApiKey: []
      tags:
        - Поставки FBS
      summary: Set Supply Shipping Method
      description: |
        The method sets shipping method, shipping date, and shipping point for the supplies. <br><br>

        For shipping by a transport company `"shippingType":"transportCompany"`, specify the ID of the electronic waybill using the method for setting [supply waybill ID](./orders-fbs#tag/fbsSupplies/operation/patchV3FbsSuppliesWaybill).<br><br>

        <div class="description_important">
          The waybill ID added to a supply is reset if the shipping type is changed from <code>"shippingType":"transportCompany"</code> to <code>selfShipping</code>. If you want to change the shipping type back to <code>transportCompany</code>, <a href='./orders-fbs#tag/fbsSupplies/operation/patchV3FbsSuppliesWaybill'>re-add the waybill ID</a>.
        </div>

        You can update the shipping method until the supply and its boxes are scanned at the shipping point. Once the supply has been scanned, this method will start returning a `409` error.<br><br>

        You can specify a maximum of 100 supplies per request. The processing result is returned for each supply separately.

        <div class="description_limit">
        <a href='./api-information#tag/introduction/Rate-Limits'>Request limit</a> per one seller account for <strong>FBS assembly orders, supplies, passes and auto-return settings</strong> methods:

        | Period | Limit | Interval | Burst |
        | --- | --- | --- | --- |
        | 1 min | 300 requests | 200 ms | 20 requests |

        One request with <code>4XX</code> response codes is counted as 10 requests

        </div>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/UpdateSuppliesShippingMethodRequest'
                - description: Supply shipping method
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSuppliesResponse'
              examples:
                UpdatedSuppliesShippingMethod:
                  $ref: '#/components/examples/UpdatedSuppliesShippingMethod'
        '400':
          description: Неправильный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                IncorrectParameter:
                  $ref: '#/components/examples/IncorrectParameter'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: Доступ запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                AccessDenied:
                  $ref: '#/components/examples/AccessDenied'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Response4XX'
              examples:
