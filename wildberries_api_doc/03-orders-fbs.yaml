      summary: Get Supply Shipping Points
      description: |
        The method returns available supply shipping points with filters:
          - by Russian localities
          - by the type of items a shipping point can accept

        Use the data from this method to set [supply shipping methods](./orders-fbs#tag/fbsSupplies/operation/patchV3FbsSuppliesShippingMethod).

        <div class="description_limit">
        <a href='./api-information#tag/introduction/Rate-Limits'>Request limit</a> per one seller account for <strong>FBS assembly orders, supplies, passes and auto-return settings</strong> methods:

