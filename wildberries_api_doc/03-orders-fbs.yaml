              description: Currency code of the seller country
              type: integer
              example: 643
            convertedPrice:
              description: The sum charged to the buyer in the currency of the seller country including all discounts, multiplied by 100
              type: integer
              example: 1020
            currencyCode:
              description: Sale currency code
              type: integer
              example: 643
            price:
              description: The price in the currency of sale including all discounts, except WB Wallet discount, multiplied by 100
              type: integer
              example: 1020
        product:
