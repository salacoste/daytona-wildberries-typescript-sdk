              type: string
              example: wv1702fyjh
            chrtId:
              description: Item size ID in WB systems
              type: integer
              format: uint64
              example: 12345678
            nmId:
              description: WB item number
              type: integer
              example: 370870300
            skus:
              description: List of SKUs
              items:
                type: string
              type: array
              example:
                - 12345Ejf5
                - 12345Ejf6
                - 12345Ejf7
        rid:
          description: |
            Unique order ID. <br>
            Note: `rid` corresponds to `srid` in the responses of the methods:
              - [Buyers Return Applications](./customer-communication#tag/buyersReturns/operation/getV1Claims)
              - [Order Feed](./analytics#tag/orderFeed/operation/postV1OrderFeed)
              - [Orders](./reports#tag/mainReports/operation/getV1SupplierOrders)
              - [Sales](./reports#tag/mainReports/operation/getV1SupplierSales)
              - [Returns and Item Movement Report](./reports#tag/returnsAndItemMovementReport)
              - [Details for the Sales Reports by Report ID](./documents-and-accounting#tag/financialReports/operation/postV1SalesReportsDetailedReportId)
              - [Details for the Sales Reports by Period](./documents-and-accounting#tag/financialReports/operation/postV1SalesReportsDetailed)
              - [Details for the Acquiring Expenses Reports by Report ID](./documents-and-accounting#tag/financialReports/operation/postV1AcquiringDetailedReportId)
              - [Details for the Acquiring Expenses Reports by Period](./documents-and-accounting#tag/financialReports/operation/postV1AcquiringDetailed)
          type: string
          example: f884001e44e511edb8780242ac120002
        scanPrice:
          description: Acceptance price in kopecks
          type: integer
          nullable: true
          example: 5200
        status:
          description: The latest assembly order statuses
          required:
            - supplierStatus
            - wbStatus
          properties:
            supplierStatus:
              description: Assembly order status set by the seller
              example: complete
              type: string
            wbStatus:
              description: Assembly order status set by WB system
              example: sent_to_carrier
              type: string
          type: object
        stickerId:
          description: Sticker ID
          example: 33811984302
          type: integer
        supplyId:
          description: Supply ID
          example: WB-GI-1234588
          type: string
          nullable: true
        warehouseId:
          description: ID of the seller warehouse from which the item was shipped
          example: 55684681
          type: integer
    MetaDetails:
      type: array
      description: Assembly order label identifiers
      items:
        type: object
        properties:
          key:
            type: string
            example: uin
            description: Label identifier
          value:
            nullable: true
            type: string
            example: null
            description: Label identifier value
          decision:
            type: string
            example: uinMaySell
            description: |
              Validation statuses.<br><br>
              `imei` validation statuses with which the supply can be transferred to delivery:
                - `filled` — Label identifier is added to the assembly order, validation is not required
                - `deadlineExceeded` — Label identifier validation is not completed and will continue. The validation can pass or fail
                - `optional` — Label identifier is not required. Validation passed
                - `imeiMaySell` — The item is approved for sale. Validation passed
                - `imeiSoldB2B` — The item was sold to a B2B buyer and approved for sale again. Validation passed

              <br><br>
              `imei` validation statuses with which the supply can not be transferred to delivery:
                - `pending` — Label identifier validation continues. Wait for the validation status to change
                - `required` — Required label identifier is not added to the assembly order. Validation failed
                - `imeiInvalidFormat` — Invalid format. Validation failed
                - `imeiAlreadySold` — The item with this IMEI has already been sold. Validation failed

              <br><br>
              `uin` validation statuses with which the supply can be transferred to delivery:
                - `filled` — Label identifier is added to the assembly order, validation is not required
                - `deadlineExceeded` —  Label identifier validation is not completed and will continue. The validation can pass or fail
                - `optional` — Label identifier is not required. Validation passed
                - `uinMaySell` — The item is approved for sale. Validation passed

              <br><br>
              `uin` validation statuses with which the supply can not be transferred to delivery:
                - `pending` — Label identifier validation continues. Wait for the validation status to change
                - `required` — Required label identifier is not added to the assembly order. Validation failed
                - `uinInvalidFormat` — Invalid format. Validation failed
                - `uinBadStatus` — Invalid batch status. Validation failed
                - `uinBadProcess` — Invalid processing stage. Validation failed
                - `uinBadStatusAndBadProcess` — Invalid batch status. Invalid processing stage. Validation failed
                - `uinNotFound` — Not found in GIIS DMDK. Validation failed.
                  The status may mean that the UIN:
                    - is not specified in the uploaded Delivery Contract Specification
                    - is not registered in GIIS DMDK
                    - is specified incorrectly and is read from the tag with errors
                    - is not in circulation

              <br><br>
              `sgtin` validation statuses with which the supply can be transferred to delivery:
                - `filled` — Label identifier is added to the assembly order, validation is not required
                - `deadlineExceeded` —  Label identifier validation is not completed and will continue. The validation can pass or fail
                - `optional` — Label identifier is not required. Validation passed
                - `sgtinIntroduced` — The item is approved for sale. Validation passed
                - `sgtinSoldB2B` — The item was sold to a B2B buyer and approved for sale again. Validation passed

              <br><br>
              `sgtin` validation statuses with which the supply can not be transferred to delivery:
                - `pending` — Label identifier validation continues. Wait for the validation status to change
                - `required` — Required label identifier is not added to the assembly order. Validation failed
                - `sgtinInvalidFormat` — Invalid format. Validation failed
                - `sgtinNoGS` — Label identifier does not contain the GS separator `\u001d`. Validation failed
                - `sgtinHasInvalidSymbols` — Label identifier contains incorrect characters or spaces. Validation failed
                - `sgtinHasNonLatinSymbols` — Label identifier contains non-special or Latin characters. Validation failed
                - `sgtinInvalidPattern` — Label identifier structure is incorrect. Validation failed
                - `sgtinNotFound` — Label identifier not found in [Chestny ZNAK](https://chestnyznak.ru/en/). Validation failed
                - `sgtinEmitted` — Label identifier has been issued. Validation failed
                - `sgtinApplied` — Putting into circulation not completed. Validation failed
                - `sgtinWrittenOff` — Written off. Validation failed
                - `sgtinRetired` — Retired. Validation failed
                - `sgtinWithdrawn` — Withdrawn. Validation failed
                - `sgtinDisaggregation` — Disaggregation. Validation failed
                - `sgtinDisaggregated` — Disaggregated. Validation failed
                - `sgtinAppliedNotPaid` — Not paid. Validation failed

              <br><br>
              `gtin` validation statuses with which the supply can be transferred to delivery:
                - `filled` — Label identifier is added to the assembly order, validation is not required
                - `optional` — Label identifier is not required. Validation passed
                - `required` — Required label identifier is not added to the assembly order. Validation failed

              <br><br>
              `expiration` validation statuses with which the supply can be transferred to delivery:
                - `filled` — Label identifier is added to the assembly order, validation is not required
                - `optional` — Label identifier is not required. Validation passed
                - `required` — Required label identifier is not added to the assembly order. Validation failed

              <br><br>
              `customsDeclaration` validation statuses with which the supply can not be transferred to delivery:
                - `required` — Required label identifier is not added to the assembly order. Validation failed

              <br><br>
              `customsDeclaration` validation statuses with which the supply can be transferred to delivery:
                - `filled` — Label identifier is added to the assembly order, validation is not required
                - `optional` — Label identifier is not required. Validation passed
