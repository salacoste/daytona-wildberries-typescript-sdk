    NmReportGetReportsResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            type: object
            required:
              - id
              - status
              - name
              - size
              - startDate
              - endDate
              - createdAt
            properties:
              id:
                description: ID отчёта
                type: string
                format: uuid
                example: 06eae887-9d9f-491f-b16a-bb1766fcb8d2
              createdAt:
                type: string
                description: Дата и время завершения генерации
                format: date-time
                example: '2024-06-26 20:05:32'
              status:
                type: string
                description: |
                  Статус отчёта:

                  * `WAITING` — в очереди на обработку
                  * `PROCESSING` — генерируется
                  * `SUCCESS —` готов
                  * `RETRY` — ожидает повторной обработки
                  * `FAILED` — не получилось сгенерировать, сгенерируйте повторно
                example: SUCCESS
              name:
                description: Название отчёта
                type: string
                example: Card report
              size:
                description: Размер отчёта, Б
                type: integer
                example: 123
              startDate:
                description: Начало периода
                type: string
                format: date
                example: '2024-06-21'
              endDate:
                description: Конец периода
                type: string
                format: date
                example: '2024-06-23'
