          $ref: '#/components/schemas/Period'
        pastPeriod:
          $ref: '#/components/schemas/pastPeriod'
        subjectId:
          example: 123
          description: ID предмета
          type: integer
          format: int32
        brandName:
          example: Apple
          description: Название товара
          type: string
        tagId:
          example: 45
          description: ID ярлыка
          type: integer
          format: int64
        nmIds:
          example:
            - 162579635
            - 166699779
          type: array
          maxItems: 50
          description: Список артикулов WB
          items:
            type: integer
            format: uint64
        orderBy:
          $ref: '#/components/schemas/OrderBy'
        positionCluster:
          description: |
            Товары с какой средней позицией в поиске показывать в отчёте:
              - `all` — все
              - `firstHundred` — от 1 до 100
              - `secondHundred` — от 101 до 200
              - `below` — от 201 и ниже
          type: string
          enum:
            - all
            - firstHundred
            - secondHundred
            - below
        includeSubstitutedSKUs:
          type: boolean
          default: true
          example: true
          description: Показать данные по прямым запросам с [подменным артикулом](https://seller.wildberries.ru/help-center/article/A-524)
        includeSearchTexts:
          type: boolean
          default: true
          example: false
          description: Показать данные по поисковым запросам без учёта подменного артикула
        limit:
          example: 150
          description: Количество товаров в ответе
          type: integer
          format: uint32
          maximum: 1000
        offset:
          example: 100
          description: После какого элемента выдавать данные
          type: integer
          format: uint32
      required:
        - currentPeriod
        - orderBy
        - positionCluster
        - limit
        - offset
