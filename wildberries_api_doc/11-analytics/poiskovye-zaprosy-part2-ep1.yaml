      type: object
      properties:
        groups:
          description: |
            Список групп товаров для таблицы
          type: array
          items:
            $ref: '#/components/schemas/TableGroupItem'
      required:
        - groups
    TableDetailsRequest:
      description: |
        Параметры запроса для пагинации по товарам в группе:
          - `currentPeriod` — текущий период
          - `pastPeriod` — предыдущий период для сравнения
      type: object
      properties:
