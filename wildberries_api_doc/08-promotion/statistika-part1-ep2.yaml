components:
  schemas:
    RequestWithDate:
      type: object
      required:
        - id
        - dates
      properties:
        id:
          description: ID кампании
          type: integer
        dates:
          description: Даты, за которые нужно получить информацию
          type: array
          items:
            type: string
            format: date
    RequestWithInterval:
      type: object
      required:
        - id
        - interval
      properties:
        id:
          description: ID кампании
          type: integer
        interval:
          description: Временной диапазон, за который необходимо выдать данные
          type: object
          properties:
            begin:
              description: Начало запрашиваемого периода
              type: string
              format: date
            end:
              description: Конец запрашиваемого периода
              type: string
              format: date
    RequestWithCampaignID:
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          description: ID кампании
          type: integer
    ResponseWithDate:
      description: Ответ при запросе с dates
      type: array
      nullable: true
      items:
        type: object
        additionalProperties: false
        properties:
          dates:
            description: Даты, за которые нужно получить информацию
            type: array
            items:
              type: string
              format: date
          views:
            type: integer
            description: |
              Количество просмотров. <br>
              За все дни, по всем артикулам WB и платформам
          clicks:
            type: integer
            description: |
              Количество кликов.<br>
              За все дни, по всем артикулам WB и платформам
          ctr:
            type: number
            description: |
              Показатель кликабельности.<br>
              Отношение числа кликов к количеству показов. Выражается в процентах<br>
              За все дни, по всем артикулам WB и платформам<br>
          cpc:
            type: number
            description: |
              Средняя стоимость клика, ₽.<br>
              За все дни, по всем артикулам WB и платформам
          sum:
            type: number
            description: |
              Затраты, ₽.<br>
              За все дни, по всем артикулам WB и платформам
          atbs:
            type: integer
            description: |
              Количество добавлений товаров в корзину.<br>
              За все дни, по всем артикулам WB и платформам
          orders:
            type: integer
            description: |
              Количество заказов.<br>
              За все дни, по всем артикулам WB и платформам
          cr:
            type: number
            description: |
              CR(conversion rate) — это отношение количества заказов к общему количеству посещений кампании.<br>
              За все дни, по всем артикулам WB и платформам
          shks:
            type: integer
            description: |
              Количество заказанных товаров, шт.<br>
              За все дни, по всем артикулам WB и платформам
          sum_price:
            type: number
            description: |
              Заказов на сумму, ₽.<br>
              За все дни, по всем артикулам WB и платформам
          days:
            $ref: '#/components/schemas/Days'
          boosterStats:
            $ref: '#/components/schemas/BoosterStats'
          advertId:
            description: ID кампании
            type: integer
    Days:
      description: Статистка по дням
      type: array
      items:
        type: object
        properties:
          date:
            description: Дата, за которую представлены данные
            type: string
            format: date-time
          views:
            type: integer
            description: Количество просмотров
          clicks:
            type: integer
            description: Количество кликов
          ctr:
            type: number
            description: |
              Показатель кликабельности, отношение числа кликов к количеству показов, %
          cpc:
            type: number
            description: Средняя стоимость клика, ₽
          sum:
            type: number
            description: Затраты, ₽
          atbs:
            type: integer
            description: Количество добавлений товаров в корзину
          orders:
            type: integer
            description: Количество заказов
          cr:
            type: number
            description: |
              CR(conversion rate) — отношение количества заказов к общему количеству посещений кампании
          shks:
            type: integer
            description: Количество заказанных товаров, шт.
          sum_price:
            type: number
            description: Заказов на сумму, ₽
          apps:
            description: Блок информации о платформе
            type: array
            items:
              type: object
              properties:
                views:
                  type: integer
                  description: Количество просмотров
                clicks:
                  type: integer
                  description: Количество кликов
                ctr:
                  type: number
                  description: |
                    Показатель кликабельности, отношение числа кликов к количеству показов, %
                cpc:
                  type: number
                  description: Средняя стоимость клика, ₽
                sum:
                  type: number
                  description: Затраты, ₽
                atbs:
                  type: integer
                  description: Количество добавлений товаров в корзину
                orders:
                  type: integer
                  description: Количество заказов
                cr:
                  type: number
                  description: |
                    CR(conversion rate) — это отношение количества заказов к общему количеству посещений кампании
                shks:
                  type: integer
                  description: Количество заказанных товаров, шт.
                sum_price:
                  type: number
                  description: Заказов на сумму, ₽
                nm:
                  description: Блок статистики по артикулам WB
                  type: array
                  items:
                    type: object
                    properties:
                      views:
                        type: integer
                        description: Количество просмотров
                      clicks:
                        type: integer
                        description: Количество кликов
                      ctr:
                        type: number
                        description: |
                          Показатель кликабельности, отношение числа кликов к количеству показов, %
                      cpc:
                        type: number
                        description: Средняя стоимость клика, ₽
                      sum:
                        type: number
                        description: Затраты, ₽
                      atbs:
                        type: integer
                        description: Количество добавлений товаров в корзину
                      orders:
                        type: integer
                        description: Количество заказов
                      cr:
                        type: number
                        description: |
                          CR(conversion rate) — отношение количества заказов к общему количеству посещений кампании
                      shks:
                        type: integer
                        description: Количество заказанных товаров, шт.
                      sum_price:
                        type: number
                        description: Заказов на сумму, ₽
                      name:
                        description: Название товара
                        type: string
                      nmId:
                        description: ID артикула WB
                        type: integer
                appType:
                  type: integer
                  description: Тип платформы (`1` — сайт, `32` — Android, `64` — IOS)
    BoosterStats:
      description: Статистика по средней позиции товара на страницах поисковой выдачи и каталога (для кампаний с единой ставкой)
      type: array
      items:
        type: object
        properties:
          date:
            description: Дата, за которую предоставлены данные
            type: string
            format: date-time
          nm:
            description: Артикул WB
            type: integer
          avg_position:
            description: Средняя позиция товара на страницах поисковой выдачи и каталога
            type: integer
    ResponseWithInterval:
      description: Ответ при запросе с interval
      type: array
      items:
        type: object
        properties:
          interval:
            description: Период
            type: object
            additionalProperties: false
            properties:
              begin:
                description: Начало периода
                type: string
                format: date
              end:
                description: Конец периода
                type: string
                format: date
          views:
            type: integer
            description: |
              Количество просмотров. <br>
              За все дни запрошенного диапазона, по всем артикулам WB и платформам
          clicks:
            type: integer
            description: |
              Количество кликов.<br>
              За все дни запрошенного диапазона, по всем артикулам WB и платформам
          ctr:
            type: number
            description: |
              Показатель кликабельности.<br>
              Отношение числа кликов к количеству показов. Выражается в процентах.<br>
              За все дни запрошенного диапазона, по всем артикулам WB и платформам
          cpc:
            type: number
            description: |
              Средняя стоимость клика, ₽.<br>
              За все дни запрошенного диапазона, по всем артикулам WB и платформам
          sum:
            type: number
            description: |
              Затраты, ₽.<br>
              За все дни запрошенного диапазона, по всем артикулам WB и платформам
          atbs:
            type: integer
            description: |
              Количество добавлений товаров в корзину.<br>
              За все дни запрошенного диапазона, по всем артикулам WB и платформам
          orders:
            type: integer
            description: |
              Количество заказов.<br>
              За все дни запрошенного диапазона, по всем артикулам WB и платформам
          cr:
            type: number
            description: |
              CR(conversion rate) — это отношение количества заказов к общему количеству посещений кампании.<br>
              За все дни запрошенного диапазона, по всем артикулам WB и платформам
          shks:
            type: integer
            description: |
              Количество заказанных товаров, шт.<br>
              За все дни запрошенного диапазона, по всем артикулам WB и платформам
          sum_price:
            type: number
            description: |
