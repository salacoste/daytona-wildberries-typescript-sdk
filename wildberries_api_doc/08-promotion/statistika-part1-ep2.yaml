paths:
  /adv/v3/fullstats:
    get:
      security:
        - HeaderApiKey: []
      summary: Статистика кампаний
      description: |
        Метод формирует статистику для кампаний независимо от типа.
        <br><br>
        Максимальный период в запросе — 31 день.
        <br><br>
        Для кампаний в статусах `7`, `9` и `11`.

        <div class="description_limit">
        <a href="/openapi/api-information#tag/Vvedenie/Limity-zaprosov">Лимит запросов</a> на один аккаунт продавца:

        | Период | Лимит | Интервал | Всплеск |
        | --- | --- | --- | --- |
        | 1 минута | 3 запроса | 20 секунд | 1 запрос |
        </div>
      tags:
        - Статистика
      parameters:
        - name: ids
          in: query
          description: ID кампаний, максимум 100 значений
          schema:
            type: string
            example: 22161678,28449281,28155229
          required: true
        - name: beginDate
          in: query
          description: Дата начала интервала
          schema:
            type: string
            format: date
          required: true
          example: '2025-09-07'
        - name: endDate
          in: query
          description: Дата окончания интервала
          schema:
            type: string
            format: date
          required: true
          example: '2025-09-08'
