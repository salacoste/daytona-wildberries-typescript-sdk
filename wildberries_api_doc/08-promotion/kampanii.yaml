                type: integer
              setId:
                description: ID сочетания предмета и пола. Для кампаний в карточке товара (**устаревший тип кампании**)
                type: integer
              setName:
                description: Сочетание предмета и пола. Для кампаний в карточке товара (**устаревший тип кампании**)
                type: string
              menuName:
                description: Название меню, где размещается кампания. Для кампаний в каталоге (**устаревший тип кампании**)
                type: string
              nms:
