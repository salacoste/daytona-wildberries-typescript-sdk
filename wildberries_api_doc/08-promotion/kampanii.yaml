            timestamps:
              $ref: '#/components/schemas/Timestamps'
            bid_type:
              type: string
              description: |
                Тип ставки:
                  - `unified` — единая ставка
                  - `manual` — ручная ставка
    AuctionAdvertNMsSettings:
      type: object
      required:
        - subject
        - bids
        - nm_id
      properties:
        bids:
          $ref: '#/components/schemas/AuctionAdvertBids'
        subject:
          $ref: '#/components/schemas/AuctionAdvertSubject'
        nm_id:
          type: integer
          format: int64
          description: Артикул WB
    AuctionAdvertBids:
      description: Ставки
      required:
        - recommendations
        - search
      properties:
        search:
          type: integer
          format: int64
          description: Ставка в поиске
        recommendations:
          type: integer
          format: int64
          description: Ставка в рекомендациях
    AuctionAdvertSubject:
      description: Предмет
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: ID предмета
          format: int64
        name:
          type: string
          description: Название предмета
    AuctionAdvertSettings:
      description: Настройки кампании
      type: object
      required:
        - payment_type
        - name
        - placements
      properties:
        payment_type:
          type: string
          enum:
            - cpm
            - cpc
          description: |
            Тип оплаты:
            - `cpm` — за показы
            - `cpc` — за клик
        name:
          type: string
          description: Имя кампании
        placements:
          description: Места размещения
          type: object
          required:
            - search
            - recommendations
          properties:
            search:
              type: boolean
              description: |
                Размещение в поиске:
                  - `false` — да
                  - `true` — нет
            recommendations:
              description: |
                Размещение в рекомендациях:
                  - `false` — отключено
                  - `true` — включено
              type: boolean
    Timestamps:
      description: Временные отметки
      type: object
      required:
        - created
        - updated
        - started
        - deleted
      properties:
        created:
          description: Время создания кампании
          type: string
          format: date-time
        updated:
          description: Время последнего изменения кампании
          type: string
          format: date-time
        started:
          description: Время последнего запуска кампании
          type: string
          format: date-time
        deleted:
          type: string
          description: Время удаления кампании. Если кампания не удалена, время указывается в будущем
          format: date-time
    response400:
      type: object
      properties:
        detail:
          type: string
          description: Детали ошибки
        origin:
          type: string
          description: ID внутреннего сервиса WB
          example: camp-api-public-cache
        request_id:
          type: string
          description: Уникальный ID запроса
          example: 6023d2950af564838f9b44a279d2140c
        status:
          type: integer
          description: HTTP статус-код
          example: 400
        title:
          type: string
          description: Заголовок ошибки
          example: invalid payload
      required:
        - detail
        - title
        - request_id
        - origin
        - status
