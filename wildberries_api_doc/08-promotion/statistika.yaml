          in: query
          description: ID кампаний, максимум 50 значений
          schema:
            type: string
            example: 22161678,28449281,28155229
          required: true
        - name: beginDate
          in: query
          description: Дата начала интервала
          schema:
            type: string
            format: date
          required: true
          example: "2025-09-07"
        - name: endDate
