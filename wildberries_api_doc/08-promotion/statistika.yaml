  /adv/v2/auto/stat-words:
    servers:
      - url: https://advert-api.wildberries.ru
    get:
      deprecated: true
      x-readonly-method: true
      x-category: advert
      security:
        - HeaderApiKey: []
      summary: Статистика кампании с единой ставкой по кластерам фраз
      description: |
        Данный метод устарел. Он будет удалён [2 февраля](https://dev.wildberries.ru/release-notes?id=429)
      tags:
        - Статистика
      parameters:
        - name: id
          in: query
          description: ID кампании
          schema:
            type: integer
            example: 1234
          required: true
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  excluded:
                    description: >-
                      Исключения (минус-фразы) для товаров из кампании. Можно задать помощью метода [установка/удаление
                      минус-фраз](./ru/openapi/promotion#tag/Parametry-kampanij/paths/~1adv~1v1~1search~1set-phrase/post)
                      или в настройках кампании в личном кабинете
                    type: array
                    items:
                      type: string
                    example:
                      - Samsung
                      - Xiaomi
                  clusters:
                    description: Кластеры ключевых фраз
                    type: array
                    items:
                      type: object
                      properties:
                        cluster:
                          description: Кластер — набор похожих ключевых фраз
                          type: string
                          example: Телефон
                        count:
                          description: Сколько раз товары показывались по всем фразам из кластера
                          type: integer
                          example: 100
                        keywords:
                          description: Ключевые фразы из кластера, по которым товары показывались хотя бы один раз
                          type: array
                          items:
                            type: string
                          example:
                            - Телефон
                            - Мобильный телефон
        "204":
          description: Кампания не найдена
        "400":
          description: Неправильный запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseAdvError1"
              examples:
                CampaignNotFoundAdv:
                  $ref: "#/components/examples/CampaignNotFoundAdv"
                AvailableOnlyForAutoCampaign:
                  $ref: "#/components/examples/AvailableOnlyForAutoCampaign"
        "401":
          $ref: "#/components/responses/401"
        "429":
          $ref: "#/components/responses/429"
