paths:
  /adv/v0/normquery/stats:
    post:
      x-readonly-method: true
      servers:
        - url: https://advert-api.wildberries.ru
      x-category: advert
      tags:
        - Статистика
      summary: Статистика поисковых кластеров
      description: |
        Метод возвращает статистику по поисковым кластерам за указанный период.<br>
        Можно использовать только для кампаний с моделью оплаты `cpm` — за показы.

        **Ограничения:**
        - Максимум 100 элементов в массиве `items`
        - Максимум 100 кластеров в ответе на каждый элемент запроса

        **Важно: Различия nm_id для разных типов кампаний:**
        | Тип кампании | Поведение nm_id |
        | --- | --- |
        | **Тип 8** (единая ставка / unified bid) | Можно использовать `nm_id = 0` для получения агрегированной статистики по всей кампании |
        | **Тип 9** (ручная ставка / manual bid) | Необходимо указывать реальные артикулы WB (nm_id) для каждого товара |

        При миграции с кампаний Типа 8 на Тип 9 убедитесь, что обновили значения `nm_id` с `0` на реальные артикулы товаров.

        <div class="description_limit">
        <a href="/openapi/api-information#tag/Vvedenie/Limity-zaprosov">Лимит запросов</a> на один аккаунт продавца:

        | Период | Лимит | Интервал | Всплеск |
        | --- | --- | --- | --- |
        | 1 мин | 10 запросов | 6 сек | 20 запросов |
        </div>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V0GetNormQueryStatsRequest"
            example:
              from: "2025-10-07"
              to: "2025-10-08"
              items:
                - advert_id: 1825035
                  nm_id: 983512347
