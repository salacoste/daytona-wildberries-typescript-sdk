openapi: 3.0.1
info:
  title: 08-promotion - Статистика (Part 2/3) (Endpoint 2/2)
  description: Extracted from original file for agent processing
  version: 1.0.0-shard
servers:
  - url: https://advert-api.wildberries.ru
tags:
  - name: Статистика
    description: Статистика endpoints
paths:
  /adv/v1/stat/words:
    get:
      security:
        - HeaderApiKey: []
      summary: Статистика кампании c ручной ставкой по ключевым фразам
      description: |
        Метод формирует статистику кампании c ручной ставкой по ключевым фразам из поисковой строки: количество просмотров товара и затраты по одной ключевой фразе.
        <br><br>
        Информация обновляется каждые 30 минут.

        <div class="description_important">
          Тип рекламных кампаний <strong>Поиск</strong> устарел.
        </div>

        <div class="description_limit">
        <a href="/openapi/api-information#tag/Vvedenie/Limity-zaprosov">Лимит запросов</a> на один аккаунт продавца:

        | Период | Лимит | Интервал | Всплеск |
        | --- | --- | --- | --- |
        | 1 секунда | 4 запроса | 250 миллисекунд | 4 запроса |
        </div>
      tags:
        - Статистика
      parameters:
        - name: id
          in: query
          description: ID кампании
          schema:
            type: integer
            example: 1
          required: true
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  words:
                    description: Блок информации по ключевым фразам
                    type: object
                    properties:
                      phrase:
                        description: Фразовое соответствие (минус фразы)
                        type: array
                        items:
                          type: string
                      strong:
                        description: Точное соответствие (минус фразы)
                        type: array
                        items:
                          type: string
                      excluded:
                        description: Минус фразы из поиска
                        type: array
                        items:
                          type: string
                      pluse:
                        description: Фиксированные фразы
                        type: array
                        items:
                          type: string
                      keywords:
                        description: Блок со статистикой по ключевым фразам
                        type: array
                        items:
                          type: object
                          properties:
                            keyword:
                              description: Ключевая фраза
                              type: string
                            count:
                              description: Количество просмотров по ключевой фразе
                              type: integer
                      fixed:
                        description: |
                          Фиксированные ключевые фразы (`true` — включены, `false` — выключены)
                        type: boolean
                  stat:
                    description: |
                      Массив информации по статистике.<br>
                      **Первый элемент массива** с `keyword: "Всего по кампании"` содержит суммарную информацию обо всех ключевых фразах.<br>
                      **Каждый следующий элемент массива** содержит информацию об отдельных ключевых фразах.<br>
                      Отображается 60 ключевых фраз с наибольшим количеством просмотров.
                    type: array
                    items:
                      type: object
                      properties:
                        advertId:
                          description: ID кампании в системе WB
                          type: integer
                        keyword:
                          description: Ключевая фраза
                          type: string
                        advertName:
                          description: Поле перманентно отключено
                          type: string
                        campaignName:
                          description: Название кампании
                          type: string
                        begin:
                          description: Дата запуска кампании
                          type: string
                          format: date-time
                        end:
                          description: Дата завершения кампании
                          type: string
                          format: date-time
                        views:
                          description: Количество просмотров
                          type: integer
                        clicks:
                          description: Количество кликов
                          type: integer
                        frq:
                          description: Частота — отношение количества просмотров к количеству уникальных пользователей
                          type: integer
                        ctr:
                          description: |
                            Кликабельность — отношение числа кликов к количеству показов, %
                          type: number
                        cpc:
                          description: Стоимость клика, ₽
                          type: number
                        duration:
                          description: Длительность кампании, в секундах
                          type: integer
                        sum:
                          description: Затраты, ₽
                          type: number
              example:
                words:
                  phrase: []
                  strong: []
                  excluded: []
                  pluse:
                    - детское постельное белье для мальчика 1.5
                  keywords:
                    - keyword: постельное белье 1.5
                      count: 772
                  fixed: true
                stat:
                  - advertId: 7703570
                    keyword: Всего по кампании
                    advertName: ''
                    campaignName: Бельё
                    begin: '2023-07-03T15:15:38.287441+03:00'
                    end: '2023-07-03T15:15:38.287441+03:00'
                    views: 1846
                    clicks: 73
                    frq: 1
                    ctr: 3.95
                    cpc: 7.88
                    duration: 769159
                    sum: 575.6
                  - advertId: 7703570
                    keyword: постельное белье 1.5 детское
                    advertName: ''
                    campaignName: Бельё
                    begin: '2023-07-03T15:15:38.287441+03:00'
                    end: '2023-07-03T15:15:38.287441+03:00'
                    views: 1846
                    clicks: 73
                    frq: 1
                    ctr: 3.95
                    cpc: 7.88
                    duration: 769159
                    sum: 575.6
        '400':
          description: Неправильный запрос
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
components:
  schemas:
    RequestWithDate:
      type: object
      required:
        - id
        - dates
      properties:
        id:
          description: ID кампании
          type: integer
        dates:
          description: Даты, за которые нужно получить информацию
          type: array
          items:
            type: string
            format: date
    RequestWithInterval:
      type: object
      required:
        - id
        - interval
      properties:
        id:
          description: ID кампании
          type: integer
        interval:
          description: Временной диапазон, за который необходимо выдать данные
          type: object
          properties:
            begin:
              description: Начало запрашиваемого периода
              type: string
              format: date
            end:
              description: Конец запрашиваемого периода
              type: string
              format: date
    RequestWithCampaignID:
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          description: ID кампании
          type: integer
    ResponseWithDate:
      description: Ответ при запросе с dates
      type: array
      nullable: true
      items:
        type: object
        additionalProperties: false
        properties:
          dates:
            description: Даты, за которые нужно получить информацию
            type: array
            items:
              type: string
              format: date
          views:
            type: integer
            description: |
              Количество просмотров. <br>
              За все дни, по всем артикулам WB и платформам
          clicks:
            type: integer
            description: |
              Количество кликов.<br>
              За все дни, по всем артикулам WB и платформам
          ctr:
            type: number
            description: |
              Показатель кликабельности.<br>
              Отношение числа кликов к количеству показов. Выражается в процентах<br>
              За все дни, по всем артикулам WB и платформам<br>
          cpc:
            type: number
            description: |
              Средняя стоимость клика, ₽.<br>
              За все дни, по всем артикулам WB и платформам
          sum:
            type: number
            description: |
              Затраты, ₽.<br>
              За все дни, по всем артикулам WB и платформам
          atbs:
            type: integer
            description: |
              Количество добавлений товаров в корзину.<br>
              За все дни, по всем артикулам WB и платформам
          orders:
            type: integer
            description: |
              Количество заказов.<br>
              За все дни, по всем артикулам WB и платформам
          cr:
            type: number
            description: |
              CR(conversion rate) — это отношение количества заказов к общему количеству посещений кампании.<br>
              За все дни, по всем артикулам WB и платформам
          shks:
            type: integer
            description: |
              Количество заказанных товаров, шт.<br>
              За все дни, по всем артикулам WB и платформам
          sum_price:
            type: number
            description: |
              Заказов на сумму, ₽.<br>
              За все дни, по всем артикулам WB и платформам
          days:
            $ref: '#/components/schemas/Days'
          boosterStats:
            $ref: '#/components/schemas/BoosterStats'
          advertId:
            description: ID кампании
            type: integer
    Days:
      description: Статистка по дням
      type: array
      items:
        type: object
        properties:
          date:
            description: Дата, за которую представлены данные
            type: string
            format: date-time
          views:
            type: integer
            description: Количество просмотров
