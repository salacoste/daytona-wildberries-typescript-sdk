openapi: 3.0.1
info:
  title: 08-promotion - Shared Schemas
  description: All shared schemas, parameters, responses, requestBodies, examples, and securitySchemes
  version: 1.0.0-shard
components:
  schemas:
    400Response:
      type: object
      properties:
        error:
          type: string
    PlacementType:
      type: string
      enum:
        - combined
        - search
        - recommendation
      description: |
        Места размещения:
          - `search` — поиск
          - `recommendation` — рекомендации
          - `combined` — поиск и рекомендации
    V0GetNormQueryStatsRequest:
      type: object
      required:
        - from
        - to
        - items
      properties:
        from:
          type: string
          format: date
          description: Дата начала периода
          example: "2025-10-07"
        to:
          type: string
          format: date
          description: Дата окончания периода
          example: "2025-10-08"
        items:
          type: array
          maxItems: 100
          items:
            type: object
            required:
              - advert_id
              - nm_id
            properties:
              advert_id:
                type: integer
                description: ID кампании
              nm_id:
                type: integer
                description: Артикул WB
    V0GetNormQueryStatsItem:
      type: object
      required:
        - advert_id
        - nm_id
      properties:
        advert_id:
          type: integer
          description: ID кампании
        nm_id:
          type: integer
          description: Артикул WB
        stats:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/V0GetNormQueryStatsItemStat"
    V0GetNormQueryStatsItemStat:
      type: object
      properties:
        norm_query:
          type: string
          description: Поисковый кластер
        views:
          type: integer
          description: Количество просмотров
        clicks:
          type: integer
          description: Количество кликов
        atbs:
          description: Количество добавлений товаров в корзину
          type: integer
        orders:
          description: Количество заказов
          type: integer
        ctr:
          description: |
            Кликабельность — отношение числа кликов к количеству показов, %
          type: number
          format: double
        cpc:
          type: number
          format: double
          description: Стоимость одного клика, ₽
        cpm:
          type: number
          format: double
          description: Средняя стоимость за тысячу показов, ₽
        avg_pos:
          type: number
          format: double
          description: Средняя позиция товара на страницах поисковой выдачи
    V0GetNormQueryStatsResponse:
      type: object
      description: Статистика по поисковым кластерам
      required:
        - stats
      properties:
        stats:
          type: array
          items:
            $ref: "#/components/schemas/V0GetNormQueryStatsItem"
    V0SetNormQueryBidsRequestItem:
      type: object
      required:
        - advert_id
        - nm_id
        - norm_query
        - bid
      properties:
        advert_id:
          type: integer
          description: ID кампании
        nm_id:
          type: integer
          description: Артикул WB
        norm_query:
          type: string
          description: Поисковый кластер
        bid:
          type: integer
          description: Ставка за тысячу показов, ₽
    V0SetNormQueryBidsRequest:
      type: object
      required:
        - bids
      properties:
        bids:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/V0SetNormQueryBidsRequestItem"
    V0SetMinusNormQueryRequest:
      type: object
      required:
        - advert_id
        - nm_id
        - norm_queries
      properties:
        advert_id:
          type: integer
          description: ID кампании
        nm_id:
          type: integer
          description: Артикул WB
        norm_queries:
          type: array
          maxItems: 1000
          items:
            type: string
            description: Поисковый кластер
    V0GetNormQueryBidsRequestItem:
      type: object
      required:
        - advert_id
        - nm_id
      properties:
        advert_id:
          type: integer
          description: ID кампании
        nm_id:
          type: integer
          description: Артикул WB
    V0GetNormQueryBidsRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/V0GetNormQueryBidsRequestItem"
    V0GetNormQueryBidsItem:
      type: object
      required:
        - advert_id
        - nm_id
        - bid
        - norm_query
      properties:
        advert_id:
          type: integer
          description: ID кампании
        nm_id:
          type: integer
          description: Артикул WB
        norm_query:
          type: string
          description: Поисковый кластер
        bid:
          type: integer
          description: Текущая ставка за тысячу показов, ₽
    V0GetNormQueryBidsResponse:
      type: object
      required:
        - bids
      properties:
        bids:
          type: array
          items:
            $ref: "#/components/schemas/V0GetNormQueryBidsItem"
    V0GetNormQueryMinusRequestItem:
      type: object
      required:
        - advert_id
        - nm_id
      properties:
        advert_id:
          type: integer
          description: ID кампании
        nm_id:
          type: integer
          description: Артикул WB
    V0GetNormQueryMinusRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/V0GetNormQueryMinusRequestItem"
    V0GetNormQueryMinusResponseItem:
      type: object
      required:
        - advert_id
        - nm_id
      properties:
        advert_id:
          type: integer
          description: ID кампании
        nm_id:
          type: integer
          description: Артикул WB
        norm_queries:
          type: array
          description: Список минус-фраз
          items:
            type: string
    V0GetNormQueryMinusResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/V0GetNormQueryMinusResponseItem"
    StandardizedBatchError:
      type: object
      properties:
        detail:
          type: string
          description: Детали ошибки
          example: some nms are not belong to advert
        origin:
          type: string
          description: ID внутреннего сервиса WB
          example: camp-api-public-cache
        request_id:
          description: Уникальный ID запроса
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
        status:
          type: integer
          description: HTTP статус-код
          example: 400
        title:
          type: string
          description: Заголовок ошибки
          example: Invalid Params
      required:
        - title
        - detail
        - request_id
        - origin
        - status
    V0GetConfigCategoriesResponse:
      type: object
      properties:
        id:
          type: integer
          description: ID категории товара
        name:
          type: string
          description: Название категории товара
        cpm_min:
          type: integer
          description: Минимально допустимая ставка
      required:
        - id
        - name
        - cpm_min
      example:
        id: 760
        name: Автомобильные товары
        cpm_min: 112
    V0AdvertMultiBidItem:
      type: object
      required:
        - nm
        - bid
      properties:
        nm:
          type: integer
          example: 3462354
          description: Артикул WB
        bid:
          type: integer
          example: 500
          description: >-
            Ставка. Минимально допустимые ставки вы можете получить в ответе метода [получения минимальных ставок для
            карточек товаров](./promotion#tag/Sozdanie-kampanij/paths/~1adv~1v0~1bids~1min/post)
    V0AdvertMultibid:
      type: object
      required:
        - advert_id
        - nm_bids
      properties:
        advert_id:
          type: integer
          example: 6348555
          description: ID кампании
        nm_bids:
          type: array
          description: Артикулы WB и ставки для них
          items:
            $ref: "#/components/schemas/V0AdvertMultiBidItem"
    ResponseWithReturn:
      type: object
      properties:
        total:
          type: integer
          description: Размер обновлённого бюджета
    ResponseInfoAdvertType8:
      type: object
      properties:
        endTime:
          description: Дата завершения кампании
          type: string
          format: date-time
        createTime:
          description: Дата создания кампании
          type: string
          format: date-time
        changeTime:
          description: Дата последнего изменения кампании
          type: string
          format: date-time
        startTime:
          description: Дата последнего запуска кампании
          type: string
          format: date-time
        autoParams:
          type: object
          properties:
            subject:
              description: Продвигаемый предмет
              type: object
              properties:
                id:
                  description: ID предмета
                  type: integer
                name:
                  description: Название предмета
                  type: string
            sets:
              description: Внутренняя (системная) сущность (пол + предмет)
              type: array
              items:
                type: object
                properties:
                  id:
                    description: ID set
                    type: integer
                  name:
                    description: Название set
                    type: string
            menus:
              type: array
              items:
                type: object
                description: Меню, где размещается кампания
                properties:
                  id:
                    description: ID меню
                    type: integer
                  name:
                    description: Название меню
                    type: string
            active:
              description: Места размещения
              type: object
              properties:
                carousel:
                  description: |
                    Карточка товара
                      - `false` — отключено
                      - `true` — включено
                  type: boolean
                recom:
                  description: |
                    Рекомендации на главной
                      - `false` — отключено
                      - `true` — включено
                  type: boolean
                booster:
                  description: |
                    Ручная ставка
                      - `false` — отключено
                      - `true` — включено
                  type: boolean
            nmCPM:
              type: array
              description: |
                Ставки карточек товаров
              items:
                type: object
                properties:
                  nm:
                    description: Артикул WB
                    type: integer
                  cpm:
                    description: Ставка
                    type: integer
            nms:
              description: Артикулы WB
              type: array
              items:
                type: integer
            cpm:
              description: |
                Ставка, указанная при создании кампании.<br> Поле актуально только для кампаний, созданных через API.
              type: integer
        name:
          description: Название кампании
          type: string
        dailyBudget:
          description: Не используется
          type: integer
        advertId:
          description: ID кампании
          type: integer
        status:
          description: |
            Статус кампании:
            - `-1` — удалена, процесс удаления будет завершён в течение 10 минут
            - `4` — готова к запуску
            - `7` — завершена
            - `8` — отменена
            - `9` — активна
            - `11` — на паузе
          type: integer
        type:
          description: |
            Тип кампании:
              - `8` — единая ставка
          type: integer
        paymentType:
          type: string
          description: |
            Модель оплаты:
            - `cpm` — за показы
    responseAdvError1:
      type: object
      properties:
        error:
          type: string
    PromotionsGoodsList:
      type: object
      properties:
        id:
          type: integer
          example: 162579635
          description: Артикул WB
        inAction:
          type: boolean
          example: true
          description: |
            Участвует в акции:
              - `true` — да
              - `false` — нет
        price:
          type: number
          format: float
          example: 1500
          description: Текущая розничная цена
        currencyCode:
          type: string
          example: RUB
          description: Валюта в формате ISO 4217
        planPrice:
          type: number
          format: float
          example: 1000
          description: Плановая цена (цена во время акции)
        discount:
          type: integer
          example: 15
          description: Текущая скидка
        planDiscount:
          type: integer
          example: 34
          description: Рекомендуемая скидка для участия в акции
    GetAuctionAdverts:
      type: object
      required:
        - adverts
      properties:
        adverts:
          description: Кампании
          type: array
          items:
            type: object
            required:
              - id
              - timestamps
              - settings
              - nm_settings
              - status
              - bid_type
            properties:
              id:
                type: integer
                format: int64
                description: ID кампании
              nm_settings:
                description: Настройки товаров
                type: array
                items:
                  $ref: "#/components/schemas/AuctionAdvertNMsSettings"
              settings:
                $ref: "#/components/schemas/AuctionAdvertSettings"
              status:
                description: |
                  Статус кампании:
                  - `-1` — удалена, процесс удаления будет завершён в течение 10 минут
                  - `4` — готова к запуску
                  - `7` — завершена
                  - `8` — отменена
                  - `9` — активна
                  - `11` — на паузе
                enum:
                  - -1
                  - 4
                  - 7
                  - 8
                  - 9
                  - 11
                type: integer
              timestamps:
                $ref: "#/components/schemas/Timestamps"
              bid_type:
                type: string
                description: |
                  Тип ставки:
                    - `unified` — единая ставка
                    - `manual` — ручная ставка
    GetAdverts:
      type: object
      required:
        - adverts
      properties:
        adverts:
          description: Кампании
          type: array
          items:
            type: object
            required:
              - id
              - timestamps
              - settings
              - nm_settings
              - status
              - bid_type
            properties:
              bid_type:
                type: string
                description: |
                  Тип ставки:
                    - `unified` — единая ставка
                    - `manual` — ручная ставка
              id:
                type: integer
                format: int64
                description: ID кампании
              nm_settings:
                description: Настройки товаров
                type: array
                items:
                  $ref: "#/components/schemas/AdvertNMsSettings"
              settings:
                $ref: "#/components/schemas/AdvertSettings"
              status:
                description: |
                  Статус кампании:
                  - `-1` — удалена, процесс удаления будет завершён в течение 10 минут
                  - `4` — готова к запуску
                  - `7` — завершена
                  - `8` — отменена
                  - `9` — активна
                  - `11` — на паузе
                enum:
                  - -1
                  - 4
                  - 7
                  - 8
                  - 9
                  - 11
                type: integer
              timestamps:
                $ref: "#/components/schemas/Timestamps"
    AuctionAdvertNMsSettings:
      type: object
      required:
        - subject
        - bids
        - nm_id
      properties:
        bids:
          $ref: "#/components/schemas/AuctionAdvertBids"
        subject:
          $ref: "#/components/schemas/AuctionAdvertSubject"
        nm_id:
          type: integer
          format: int64
          description: Артикул WB
    AdvertNMsSettings:
      type: object
      required:
        - subject
        - bids_kopecks
        - nm_id
      properties:
        bids_kopecks:
          $ref: "#/components/schemas/AdvertBidsKopecks"
        subject:
          $ref: "#/components/schemas/AdvertSubject"
        nm_id:
          type: integer
          format: int64
          description: Артикул WB
    AuctionAdvertSubject:
      description: Предмет
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: ID предмета
          format: int64
        name:
          type: string
          description: Название предмета
    AdvertSubject:
      description: Предмет
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: ID предмета
          format: int64
        name:
          type: string
          description: Название предмета
    AuctionAdvertBids:
      description: Ставки
      required:
        - recommendations
        - search
      properties:
        search:
          type: integer
          format: int64
          description: Ставка в поиске
        recommendations:
          type: integer
          format: int64
          description: Ставка в рекомендациях
    AdvertBidsKopecks:
      description: Ставки, копейки
      required:
        - recommendations
        - search
      properties:
        search:
          type: integer
          format: int64
          description: Ставка в поиске
        recommendations:
          type: integer
          format: int64
          description: Ставка в рекомендациях
    AuctionAdvertSettings:
      description: Настройки кампании
      type: object
      required:
        - payment_type
        - name
        - placements
      properties:
        payment_type:
          type: string
          enum:
            - cpm
            - cpc
          description: |
            Тип оплаты:
            - `cpm` — за показы
            - `cpc` — за клик
        name:
          type: string
          description: Имя кампании
        placements:
          description: Места размещения
          type: object
          required:
            - search
            - recommendations
          properties:
            search:
              type: boolean
              description: |
                Размещение в поиске:
                  - `false` — отключено
                  - `true` — включено
            recommendations:
              description: |
                Размещение в рекомендациях:
                  - `false` — отключено
                  - `true` — включено
              type: boolean
    AdvertSettings:
      description: Настройки кампании
      type: object
      required:
        - payment_type
        - name
        - placements
      properties:
        payment_type:
          type: string
          enum:
            - cpm
            - cpc
          description: |
            Тип оплаты:
            - `cpm` — за показы
            - `cpc` — за клик
        name:
          type: string
          description: Название кампании
        placements:
          description: Места размещения
          type: object
          required:
            - search
            - recommendations
          properties:
            search:
              type: boolean
              description: |
                Размещение в поиске:
                  - `false` — отключено
                  - `true` — включено
            recommendations:
              description: |
                Размещение в рекомендациях:
                  - `false` — отключено
                  - `true` — включено
              type: boolean
    Timestamps:
      description: Временные отметки
      type: object
      required:
        - created
        - updated
        - started
        - deleted
      properties:
        created:
          description: Время создания кампании
          type: string
          format: date-time
        updated:
          description: Время последнего изменения кампании
          type: string
          format: date-time
        started:
          description: Время последнего запуска кампании
          nullable: true
          type: string
          format: date-time
        deleted:
          type: string
          description: Время удаления кампании. Если кампания не удалена, время указывается в будущем
          format: date-time
    response400:
      type: object
      properties:
        detail:
          type: string
          description: Детали ошибки
        origin:
          type: string
          description: ID внутреннего сервиса WB
          example: camp-api-public-cache
        request_id:
          type: string
          description: Уникальный ID запроса
          example: 6023d2950af564838f9b44a279d2140c
        status:
          type: integer
          description: HTTP статус-код
          example: 400
        title:
          type: string
          description: Заголовок ошибки
          example: invalid payload
      required:
        - detail
        - title
        - request_id
        - origin
        - status
    StatInterval:
      additionalProperties: false
      type: object
      required:
        - interval
      properties:
        interval:
          description: Период
          type: object
          properties:
            begin:
              description: Начало периода
              type: string
              format: date
            end:
              description: Конец периода
              type: string
              format: date
        stats:
          description: Блок статистики
          type: array
          items:
            $ref: "#/components/schemas/StatsBlok1"
    StatDate:
      additionalProperties: false
      type: object
      required:
        - dates
      properties:
        dates:
          description: Даты, за которые нужно получить информацию
          type: array
          items:
            type: string
            format: date
        stats:
          description: Блок статистики
          type: array
          items:
            $ref: "#/components/schemas/StatsBlok2"
    Stat:
      additionalProperties: false
      type: object
      properties:
        stats:
          description: Блок статистики
          type: array
          items:
            $ref: "#/components/schemas/StatsBlok1"
    StatsBlok1:
      type: object
      properties:
        item_id:
          description: ID баннера
          type: integer
        item_name:
          description: Бренд
          type: string
        category_name:
          description: Название категории
          type: string
        advert_type:
          description: |
            Тип медиакампании:
              - `1` — размещение по дням
              - `2` — размещение по просмотрам
          type: integer
        place:
          description: Место на странице
          type: integer
        views:
          description: Количество просмотров
          type: integer
        clicks:
          description: Количество кликов
          type: integer
        cr:
          description: |
            CR(conversion rate) — это отношение количества заказов к общему количеству посещений медиакампании
          type: number
        ctr:
          description: >
            CTR (click-through rate) — показатель кликабельности, отношение числа кликов к количеству показов в рамках
            медиакампании
          type: number
        date_from:
          description: Время начала размещения
          type: string
          format: date-time
        date_to:
          description: Время завершения размещения
          type: string
          format: date-time
        subject_name:
          description: Родительская категория предмета
          type: string
        atbs:
          description: Количество добавлений товаров в корзину
          type: integer
        orders:
          description: Количество заказов
          type: integer
        price:
          description: Стоимость размещения
          type: number
        cpc:
