openapi: 3.0.1
info:
  title: 08-promotion - Статистика (Part 2/3) (Endpoint 1/2)
  description: Extracted from original file for agent processing
  version: 1.0.0-shard
servers:
  - url: https://advert-api.wildberries.ru
tags:
  - name: Статистика
    description: Статистика endpoints
paths:
  /adv/v2/auto/stat-words:
    get:
      security:
        - HeaderApiKey: []
      summary: Статистика кампании с единой ставкой по кластерам фраз
      deprecated: true
      description: |
        <div class="description_important">
          ⚠️ **DEPRECATED**: Этот метод устарел и будет отключён **2 февраля 2026**.<br><br>

          **Причина**: Переход от кампаний с единой ставкой (type 8) к кампаниям с ручной и единой ставкой (type 9).<br><br>

          **Альтернатива**: Для получения статистики всех типов кампаний (включая type 9) используйте универсальный метод [Полная статистика кампаний](/openapi/promotion#tag/Statistika/paths/~1adv~1v3~1fullstats/get). Он предоставляет более подробную статистику для всех типов кампаний.
        </div>

        Метод формирует кластеры ключевых — то есть, наборы похожих — фраз из поисковой строки, если по ним хотя бы один раз были показаны товары из кампании. В ответе метода также указано количество показов этих товаров.
        <br><br>
        Информация обновляется каждые 15 минут.

        <div class="description_limit">
        <a href="/openapi/api-information#tag/Vvedenie/Limity-zaprosov">Лимит запросов</a> на один аккаунт продавца:

        | Период | Лимит | Интервал | Всплеск |
        | --- | --- | --- | --- |
        | 1 секунда | 4 запроса | 250 миллисекунд | 4 запроса |
        </div>
      tags:
        - Статистика
      parameters:
        - name: id
          in: query
          description: ID кампании
          schema:
            type: integer
            example: 1234
          required: true
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  excluded:
                    description: Исключения (минус-фразы) для товаров из кампании. Можно задать помощью метода [установка/удаление минус-фраз](./ru/openapi/promotion#tag/Parametry-kampanij/paths/~1adv~1v1~1search~1set-phrase/post) или в настройках кампании в личном кабинете
                    type: array
                    items:
                      type: string
                    example:
                      - Samsung
                      - Xiaomi
                  clusters:
                    description: Кластеры ключевых фраз
                    type: array
                    items:
                      type: object
                      properties:
                        cluster:
                          description: Кластер — набор похожих ключевых фраз
                          type: string
                          example: Телефон
                        count:
                          description: Сколько раз товары показывались по всем фразам из кластера
                          type: integer
                          example: 100
                        keywords:
                          description: Ключевые фразы из кластера, по которым товары показывались хотя бы один раз
                          type: array
                          items:
                            type: string
                          example:
                            - Телефон
                            - Мобильный телефон
        '204':
          description: Кампания не найдена
        '400':
          description: Неправильный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseAdvError1'
              examples:
                CampaignNotFoundAdv:
                  $ref: '#/components/examples/CampaignNotFoundAdv'
                AvailableOnlyForAutoCampaign:
                  $ref: '#/components/examples/AvailableOnlyForAutoCampaign'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
