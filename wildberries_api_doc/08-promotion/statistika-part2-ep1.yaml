              format: date
          views:
            type: integer
            description: |
              Количество просмотров. <br>
              За все дни, по всем артикулам WB и платформам
          clicks:
            type: integer
            description: |
              Количество кликов.<br>
              За все дни, по всем артикулам WB и платформам
